# Prometheus scrape config (Train Ticket). cAdvisor per-container + node-exporter host series.
# Per-service app metrics: TT Spring Boot services do NOT ship a micrometer /actuator/prometheus
# endpoint by default, so service-level latency/QPS for the metrics modality is not available
# from Prometheus here - it comes from the TRACES modality (OTLP spans give per-request latency)
# and cAdvisor (per-container resource). If actuator/prometheus turns out to be enabled on the
# VM, uncomment the ts-services job below and fill targets (job labels must match
# verification_targets.json). 5s scrape matches STEP=5s in download_metrics_full.sh.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: node-exporter
    static_configs:
      - targets: ['nodeexporter:9100']

  # - job_name: ts-services            # enable if actuator/prometheus is available (verify on VM)
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ['ts-order-service:12031', 'ts-travel-service:12346', 'ts-auth-service:12340']
