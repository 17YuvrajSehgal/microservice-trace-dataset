# docker-compose.dbenv.yml (Train Ticket) - shared MySQL 8 for all MySQL services.
# TT's compose ships MongoDB but 20 services' SOURCE uses MySQL (jdbc:mysql://ts-*-mysql) with
# bad defaults (10.176.122.1, localhost, an 's-train-mysql' typo, auth pw 'Abcd1234#'). One
# MySQL 8 + tt-init.sql databases + normalize every service's <PREFIX>_MYSQL_* env to it.
# The 2 Mongo services (preserve, preserve-other) keep their mongos in the base compose.
services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    command: ["--default-authentication-plugin=mysql_native_password", "--max_connections=2000"]
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ${TT_SCRIPTS_DIR:?set TT_SCRIPTS_DIR}/tt-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: ["my-network"]
    restart: unless-stopped
  ts-assurance-service:
    environment:
      ASSURANCE_MYSQL_HOST: "mysql"
      ASSURANCE_MYSQL_PORT: "3306"
      ASSURANCE_MYSQL_DATABASE: "ts-assurance-mysql"
      ASSURANCE_MYSQL_USER: "root"
      ASSURANCE_MYSQL_PASSWORD: "root"
  ts-auth-service:
    environment:
      AUTH_MYSQL_HOST: "mysql"
      AUTH_MYSQL_PORT: "3306"
      AUTH_MYSQL_DATABASE: "ts-auth-mysql"
      AUTH_MYSQL_USER: "root"
      AUTH_MYSQL_PASSWORD: "root"
  ts-config-service:
