# docker-compose.nacos.yml (Train Ticket) - nacos discovery server + point services at it.
# TT gateway + backends use spring-cloud nacos discovery (lb:// routing); the compose omitted
# nacos so the gateway crash-looped and all routes 502d. Standalone nacos + NACOS_ADDRS for
# every Java service + the gateway so they register/discover. Load with the other overlays.
services:
  nacos:
    image: nacos/nacos-server:v2.0.3
    container_name: nacos
    environment:
      MODE: standalone
    ports: ["8848:8848", "9848:9848"]
    networks: ["my-network"]
    restart: unless-stopped
  ts-admin-basic-info-service:
    environment:
      NACOS_ADDRS: "nacos:8848"
  ts-admin-order-service:
    environment:
      NACOS_ADDRS: "nacos:8848"
  ts-admin-route-service:
