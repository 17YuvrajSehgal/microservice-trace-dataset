# Dual span export (Phase 0):
#   otlp    -> otel-collector:4317 -> file exporter (native spans; the dataset's
#              distributed-trace modality)
#   logging -> container stdout -> otel-to-lttng.py relay -> LTTng UST (kept as
#              the cross-layer clock bridge into the kernel trace domain)
otel.traces.exporter=otlp,logging
otel.exporter.otlp.endpoint=http://otel-collector:4317
otel.exporter.otlp.protocol=grpc
otel.logs.exporter=logging
otel.metrics.exporter=none
otel.instrumentation.common.experimental.span-suppression-strategy=none
otel.propagators=tracecontext,baggage
