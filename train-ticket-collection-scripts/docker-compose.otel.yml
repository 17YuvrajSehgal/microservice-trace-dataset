# docker-compose.otel.yml (Train Ticket) - GENERATED from service_map._TT_JAVA.
# OTel Java agent into all ts-*-service via JAVA_TOOL_OPTIONS + otel-collector -> /otlp-out/spans.jsonl.
# Requires TT_SCRIPTS_DIR. Load AFTER the base.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    container_name: otel-collector
    user: "0:0"
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ${TT_SCRIPTS_DIR:?set TT_SCRIPTS_DIR to abs path of train-ticket-collection-scripts}/agents/otel-collector-config.yaml:/etc/otel/config.yaml:ro
      - ${TT_SCRIPTS_DIR:?}/otlp-out:/otlp-out
    ports: ["4317:4317", "4318:4318"]
    networks: ["my-network"]
    restart: unless-stopped
  ts-admin-basic-info-service:
    volumes:
      - ${TT_SCRIPTS_DIR:?}/agents:/otel:ro
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/otel/otel.properties"
      OTEL_SERVICE_NAME: "ts-admin-basic-info-service"
  ts-admin-order-service:
    volumes:
      - ${TT_SCRIPTS_DIR:?}/agents:/otel:ro
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/otel/otel.properties"
      OTEL_SERVICE_NAME: "ts-admin-order-service"
  ts-admin-route-service:
