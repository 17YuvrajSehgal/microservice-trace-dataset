# Compose override for the Phase-0 trace pipeline.
#
# 1. Injects the OpenTelemetry Java agent (2.25.0) into the four Spring Boot
#    Sock Shop services (carts, orders, shipping, queue-master). Per
#    agents/otel.properties the agent dual-exports every span:
#      - otlp    -> the otel-collector service below -> OTLP-JSON lines in
#                   ./otlp-out/spans.jsonl (native spans: start/end timestamps,
#                   parent/child links, attributes)
#      - logging -> container stdout, where agents/otel-to-lttng.py forwards
#                   LoggingSpanExporter lines into LTTng UST (cross-layer clock
#                   bridge into the kernel trace domain)
# 2. Runs the OpenTelemetry Collector that receives the OTLP stream and writes
#    it to disk.
#
# Usage on the trace-collection VM:
#   cd ~/microservices-demo/deploy/docker-compose
#   export TRACE_SCRIPTS_DIR=~/microservice-trace-dataset/microservice-lttng-data-collection-scripts
#   COMPOSE_COMPATIBILITY=true docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.monitoring.yml \
#     -f "$TRACE_SCRIPTS_DIR/docker-compose.otel.yml" \
#     up -d
#
# TRACE_SCRIPTS_DIR must point at this file's directory. Relative bind-mount
# paths in override files are resolved against the PROJECT directory (the
# first -f file's dir) by current Compose versions - not against this file -
# so the mounts below use the env var explicitly and fail fast if it is unset.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    # The contrib image runs as uid 10001 by default, which cannot write to a
    # root-owned bind-mounted ./otlp-out on the VM. Root is acceptable for this
    # single-tenant research rig.
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ${TRACE_SCRIPTS_DIR:?set TRACE_SCRIPTS_DIR to the microservice-lttng-data-collection-scripts dir}/agents/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      - ${TRACE_SCRIPTS_DIR}/otlp-out:/otlp-out
    ports:
      # Host-side access for debugging and local OTLP senders; the Java agents
      # reach the collector over the compose network (otel-collector:4317).
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  carts:
    volumes:
      - ${TRACE_SCRIPTS_DIR:?set TRACE_SCRIPTS_DIR to the microservice-lttng-data-collection-scripts dir}/agents:/otel:ro
    environment:
      - OTEL_SERVICE_NAME=carts
      - JAVA_OPTS=-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/otel/otel.properties -Xms64m -Xmx256m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false

  orders:
    volumes:
      - ${TRACE_SCRIPTS_DIR:?set TRACE_SCRIPTS_DIR to the microservice-lttng-data-collection-scripts dir}/agents:/otel:ro
    environment:
      - OTEL_SERVICE_NAME=orders
      - JAVA_OPTS=-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/otel/otel.properties -Xms64m -Xmx256m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false

  shipping:
    volumes:
      - ${TRACE_SCRIPTS_DIR:?set TRACE_SCRIPTS_DIR to the microservice-lttng-data-collection-scripts dir}/agents:/otel:ro
    environment:
      - OTEL_SERVICE_NAME=shipping
      - JAVA_OPTS=-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/otel/otel.properties -Xms64m -Xmx256m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false

  queue-master:
    volumes:
      - ${TRACE_SCRIPTS_DIR:?set TRACE_SCRIPTS_DIR to the microservice-lttng-data-collection-scripts dir}/agents:/otel:ro
    environment:
      - OTEL_SERVICE_NAME=queue-master
      - JAVA_OPTS=-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/otel/otel.properties -Xms64m -Xmx256m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false
