# Compose override for the Phase-0 metrics modality.
#
# 1. Adds cAdvisor so Prometheus collects per-container CPU/memory/network/
#    blkio series (container_*). Without these, the metrics modality has no
#    service-level resource visibility (node-exporter is host-wide only) and
#    would be unfairly handicapped in the modality comparison.
# 2. Replaces the Prometheus scrape config with prometheus-cadvisor.yml
#    (upstream config + cadvisor job). Compose merges volume mounts by
#    container target path, so this later file's mount wins over the one in
#    docker-compose.monitoring.yml.
#
# Usage on the trace-collection VM (add after the monitoring override):
#   cd ~/microservices-demo/deploy/docker-compose
#   export TRACE_SCRIPTS_DIR=~/microservice-trace-dataset/microservice-lttng-data-collection-scripts
#   COMPOSE_COMPATIBILITY=true docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.monitoring.yml \
#     -f "$TRACE_SCRIPTS_DIR/docker-compose.metrics.yml" \
#     -f "$TRACE_SCRIPTS_DIR/docker-compose.otel.yml" \
#     up -d
#
# TRACE_SCRIPTS_DIR must point at this file's directory (see the note in
# docker-compose.otel.yml about Compose resolving relative mounts against the
# project directory, not the override file's directory).

services:
  prometheus:
    # Upstream's monitoring compose gives prometheus NO restart policy, so it
    # stays DOWN after a host reboot - which silently empties the metrics
    # modality for every run until someone notices (cost us a full gate run).
    restart: unless-stopped
    volumes:
      - ${TRACE_SCRIPTS_DIR:?set TRACE_SCRIPTS_DIR to the microservice-lttng-data-collection-scripts dir}/prometheus-cadvisor.yml:/etc/prometheus/prometheus.yml

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    # ENABLE THE `process` METRIC GROUP. cAdvisor v0.49 disables it by default, and its absence
    # was measured rather than guessed: a calibration pass looking for verification targets found
    # `container_file_descriptors` and `container_processes` simply not present, which left four
    # of the new faults with no metric signature at all.
    #
    # The default --disable_metrics is:
    #   advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp
    # The flag REPLACES that list rather than adding to it, so re-enabling something means
    # writing the list back out without it.
    #
    # Turned on: process (file descriptors, processes, threads, sockets), tcp and udp (per
    # container socket-state counts). Left off: sched and referenced_memory, which are the
    # expensive ones, plus the NUMA/cpuset/hugetlb groups this hardware makes meaningless.
    #
    # What this buys, per fault:
    #   fd_exhaustion         container_file_descriptors pinned at the cap
    #   conn_pool_exhaustion  the DB's descriptor and socket counts climbing
    #   fork_storm            container_processes / container_threads
    #   deadlock              container_threads with none of them running
    #
    # Cheap to add now, impossible to add later - the metrics modality of every run in the
    # campaign is whatever cAdvisor was configured to emit at collection time.
    command:
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,referenced_memory,resctrl,sched
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      # Host 8081 (not 8080): Sock Shop's edge-router already publishes host
      # 8080. Prometheus scrapes cadvisor over the compose network at
      # cadvisor:8080 (see prometheus-cadvisor.yml), so the container port and
      # the scrape are unaffected; this host publish is only for debugging.
      - "8081:8080"
    restart: unless-stopped
