# Blueprint 48 as a structure (28-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: code_zombie_procs
fault_type: code_zombie_procs
title: a program never collects its child processes
problem_class: Resource leak (process table)
confirms: A program starts child processes and never waits for them, so each dead child stays in the process table
  as a zombie.
evidence: An LTTng kernel trace only
not_used: Logs, metrics, spans, source code
when_to_use: The number of processes on a host or in a container climbs with no load change; or you look for the
  cause before a later 'cannot fork'.
status: Calibrated on its 5 v3 runs; tested on all 50 runs of groups 5-7. Not yet checked on the earlier runs. Not
  run by an agent yet.
background: 'The kernel frees a dead process only when its parent has asked how it ended. `unreaped.py` follows
  each child created in the

  slice: created (`sched_process_fork`), ended (`sched_process_exit`), freed (`sched_process_free`).


  | | this fault | normal |

  |---|---|---|

  | children started in 60 s | 227-239 | |

  | of those that ended, never freed | **220-232 of 220-232 (100%)** | 0 |


  No metric shows this fault (the family runs with `no_metric_signature`): zombies use no CPU and almost no memory.

  '
lookalikes: 'A process storm (blueprint 13): far more children, and they are collected.

  A shell script: the collection''s own script started 1,034 children in a slice and collected every one.

  A thread leak (blueprint 35): threads of one process that are alive.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  unreaped.py:
    does: Children started, ended and never freed, per parent; the verdict
    usage: unreaped.py <baseline_slice> <fault_slice>
vars:
  EV: sched_process_fork|sched_process_exit|sched_process_free
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the suspect slice, HH:MM:SS
  base_time: start of the baseline slice, HH:MM:SS
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 60 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a 60 s slice
      that starts at it.

      The baseline slice is the same length, just before the suspect time, with the same traffic. Both must lie
      inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Run the tool on the two slices.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 60 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 60 $WORK/f.txt $EV
    - unreaped.py $WORK/b.txt $WORK/f.txt
    read: 'One table and one VERDICT line.

      '
    sets: []
    budget: 5
    outcomes:
      'yes':
        when: the tool reads CHILD PROCESSES ARE NEVER COLLECTED
        line: 'VERDICT: CHILD PROCESSES ARE NEVER COLLECTED'
        verdict: confirmed
        fault_type: code_zombie_procs
        next: report
      'no':
        when: the tool reads NO UNREAPED CHILDREN
        line: 'VERDICT: NO UNREAPED CHILDREN'
        stop: Every child that ended was collected. Not this fault.
report: 'fault_type: code_zombie_procs. Copy the VERDICT line. Fix: wait for every child you start, or use a helper
  that reaps them.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5**; reversed quiet.'
- '**Quiet on the other 45 runs** (0 unreaped children anywhere).'
- '**Not yet run on the earlier runs.**'
