# Blueprint 20 as a structure (20-11-2026). The source of BLUEPRINT.md (bp_render.py) and
# of the agent's steps (bp_graph.py). Wording and numbers are those of README_v1.md.

id: nagle_delayed_ack
fault_type: nagle_delayed_ack
title: requests are slow by one fixed timer and nothing is busy (Nagle + delayed ACK)
problem_class: Configuration (two TCP defaults that are bad together)
confirms: A sender writes a request in two small writes; the second write waits for an ACK that the receiver is holding back.
evidence: An LTTng kernel trace only, with `net_dev_queue`
not_used: Logs, metrics, packet contents
when_to_use: >-
  A call is slow, and every other blueprint says the system is healthy: CPU idle, disk
  idle, no loss, no retransmits, no errors.
status: >-
  Calibrated on 10 labelled `nagle_delayed_ack` runs (5 Sock Shop, 5 Train Ticket; 8 stalled
  connections and 8 control connections with `TCP_NODELAY` in one container) and checked on
  the other 293 runs of both applications. One bar was added after the sweep (see Measured).
  Agent (20-11-2026, graph harness, gpt-6-luna): one labelled run, confirmed.

background: |
  - **Nagle:** the sender holds a small write until its earlier data is ACKed.
  - **Delayed ACK:** the receiver holds the ACK on a timer, hoping to send it with a reply.

  A request written as header then body hits both. The header goes out. The body waits for
  the ACK of the header. The receiver has no reply yet (it needs the body), so it holds the
  ACK until its timer fires. Measured: **40.6-40.9 ms on both applications**, every request.

  One stall looks like this on a connection, in the transmit events:

  ```
  A -> B   data                    the first small write
  ... nothing for 20 ms or more
  B -> A   a bare ACK, no data     the delayed-ACK timer fired
  A -> B   data, right away        the write Nagle was holding
  ```

  A slow server does not make this pattern: there the silence ends with the reply. A lossy
  or delayed path makes some of these (10-22 per connection in 10 s), but their lengths are
  spread out (0-60% within 10% of the median). The timer gives one length every time (100%).

  | | this fault | lossy / delayed path | healthy |
  |---|---|---|---|
  | stalls on the worst connection, 10 s | **113-198** | 10-22 | 0-10 |
  | share of them at one length | **100%** | 0-60% | any (too few) |
  | time the connection spends waiting | **46-82%** | up to 14% | up to 4% |

lookalikes: |
  A slow server: it does not make this pattern; there the silence ends with the reply.
  A lossy or delayed path: makes some of these stalls (10-22 per connection in 10 s), but their lengths are spread out (0-60% within 10% of the median).
  A healthy connection with a few such stalls: a telemetry connection of `node` to port 4317 had exactly 10 stalls of 40.6 ms. That is the real interaction, but too small to matter.

tools:
  idx_summary.py: {does: "Date, span, health", usage: "idx_summary.py <trace_dir> [--rate SECONDS]"}
  extract_slice.sh: {does: "Cuts one slice with the events you name", usage: "extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'"}
  ack_stall.py: {does: "Delayed-ACK stalls per connection, the verdict", usage: "ack_stall.py <net_slice> <secs>"}
  victim_info.py: {does: "Who a pid is", usage: "victim_info.py <sched_slice> <secs> <pid>"}

facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  slice_time: start of the 10 s network slice inside the suspect window, HH:MM:SS only (no date)
  waiting_process: the process on the verdict line (comm, pid, pid_ns) and the port it calls

start: check_trace

steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
      - [idx_summary.py, $TRACE]
    extract:
      day: '^date \(UTC\)\s*:\s*(\S+)'
      trace_start: '^trace start\s*:\s*(\d\d:\d\d:\d\d)'
      trace_end: '^trace end\s*:\s*(\d\d:\d\d:\d\d)'
      duration_s: '^duration\s*:\s*([\d.]+)'
      lost_events: '^lost events\s*:\s*(.+)$'
    next: orient

  orient:
    kind: guided
    goal: Pick a time inside the suspect window for one 10 s network slice.
    suggested:
      - idx_summary.py $TRACE --rate 10
    read: |
      The last table is the trace data written per 10 s. Pick a time inside the suspect
      window. If you were given a suspect time, use it. The slice is 10 s and must lie
      inside the trace.
    sets: [slice_time]
    budget: 3
    outcomes:
      time_chosen:
        when: a slice time is chosen
        next: stalls

  stalls:
    kind: guided
    goal: Count the delayed-ACK stalls per connection and read the verdict.
    suggested:
      - extract_slice.sh $TRACE <day> <slice_time> 10 $WORK/net.txt net_dev_queue
      - ack_stall.py $WORK/net.txt 10
    read: |
      ack_stall.py prints one row per connection and one VERDICT line. Columns: `stalls`,
      `median ms`, `same timer` (share of the stalls within 10% of the median), `waiting s`,
      the waiting side, and both ends. The tool does not assume a timer value, it reads it.
      Connections of the same process to the same port that do NOT appear in the table are
      the proof that the path is fine: same process, same server, no stall. To find the
      start of the incident window, you may cut earlier slices and look for the first one
      with the verdict.
    sets: [waiting_process]
    budget: 5
    outcomes:
      nagle:
        when: the tool reads NAGLE + DELAYED ACK SHAPE (that process is the sender that waits; the port is the service it calls)
        line: "VERDICT: NAGLE + DELAYED ACK SHAPE"
        verdict: confirmed
        next: report
      none:
        when: the tool reads NO NAGLE + DELAYED ACK STALLS
        line: "VERDICT: NO NAGLE + DELAYED ACK STALLS"
        stop: Not this fault. A sender that stalls only now and then stays under the bar; the table still shows it.

report: |
  fault_type: `nagle_delayed_ack`. Root cause: the process and container from the verdict
  line (`comm`, `pid_ns`). Culprit: `comm (pid P)`. Victim: the same process (it delays
  itself). Incident window: cut earlier slices to find the first one with the verdict.
  Evidence: the verdict line word for word. Fix: set `TCP_NODELAY` on the sender's socket,
  or send header and body in one write.

measured:
  - "Per-run lines: `RESULTS.md` next to this file. 10 of 10 labelled runs, 0 false alarms in 293 other runs with the final rule."
  - "**One bar was added after the sweep.** The first rule (10 stalls, 80% at one length) fired on one healthy run: a telemetry connection of `node` to port 4317 had exactly 10 stalls of 40.6 ms, which cost it 0.41 s of 10 s. That is the real interaction, but too small to matter. The rule now also needs the connection to spend 20% of the slice waiting (fault: 46-82%; largest elsewhere 14%, and that one fails the one-length test)."
  - "**The ground truth says 100 ms; the trace says 41 ms.** `ground_truth.json` has `expected_stall_ms: 100` from a smoke run. In all 10 collected runs the ACK comes after 40.6-40.9 ms. The tool does not assume a value, it reads it."
  - "A sender that stalls only now and then (a few requests per second) stays under the 20% bar. The table still shows it."
  - "In the labelled runs both ends are in one container on loopback. On a path that crosses containers the same events appear (once per device), but that was not measured with this fault."
  - "Two containers that both use 127.0.0.1 with the same port pair at the same time would be mixed into one connection."
