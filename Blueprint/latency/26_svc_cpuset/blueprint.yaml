# Blueprint 26 as a structure (25-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: svc_cpuset
fault_type: svc_cpuset
title: one container runs on far fewer CPUs than before (cpuset too small)
problem_class: CPU (a placement limit)
confirms: The CPUs one container may use were cut down, so its threads queue for the few cores left while the other
  cores are idle.
evidence: An LTTng kernel trace only, with the scheduling events
not_used: Logs, metrics, spans, source code
when_to_use: A service is slower and its CPU use is flat or lower, while the host has idle cores.
status: 'Calibrated on the 5 v3 `svc_cpuset` runs (carts confined to one core). Checked on all 347 runs: one false
  alarm. Not run by an agent yet.'
background: '`cpu_confine.py` finds, per container, the fewest CPUs that carry 99% of its CPU time, in a baseline

  slice and in the suspect slice. A confined container ran on many CPUs before and on few now, and its

  threads wait for a core while other cores are idle.


  | | this fault | a CPU quota (`svc_cpu_cap`) | a low CPU weight (`cpu_weight`) |

  |---|---|---|---|

  | CPUs it runs on | **12 before, 1 now** | all | all |

  | other cores | idle | idle | busy |

  '
lookalikes: 'A CPU quota: the container runs on all CPUs, in bursts of a 100 ms period.

  A low CPU weight on a busy host: all CPUs, and no core is idle (the `cpu_weight` blueprint).

  A single-threaded program: one CPU by nature; it needs 8+ threads and 4+ CPUs before to be judged.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  cpu_confine.py:
    does: CPUs used per container, before and now; the verdict
    usage: cpu_confine.py <baseline_slice> <fault_slice> <secs>
vars:
  EV: sched_switch|sched_waking|sched_wakeup
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the 20 s suspect slice, HH:MM:SS
  base_time: start of the 20 s baseline slice, HH:MM:SS
  culprit: the container on the verdict line
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 20 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that

      starts 30 s after it, and a baseline slice that ends 20 s before it. If not, take the stretch where the rate

      changes and a stretch before it with the same traffic. Both slices are 20 s and must lie inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Count the CPUs each container runs on, before and now.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 20 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 20 $WORK/f.txt $EV
    - cpu_confine.py $WORK/b.txt $WORK/f.txt 20
    read: 'One row per container with 8+ threads and 0.2+ cores in both slices, and one VERDICT line.

      '
    sets: []
    budget: 5
    outcomes:
      confined:
        when: the tool reads CONTAINER CONFINED TO FEW CPUS
        line: 'VERDICT: CONTAINER CONFINED TO FEW CPUS'
        verdict: confirmed
        fault_type: svc_cpuset
        next: report
      free:
        when: the tool reads NO CONTAINER CONFINED TO FEW CPUS
        line: 'VERDICT: NO CONTAINER CONFINED TO FEW CPUS'
        stop: No container lost CPUs. Not this fault.
report: 'fault_type: svc_cpuset. The container on the verdict line. Evidence: the verdict line (CPUs before and
  now, CPU

  wait, idle share of the other CPUs). Fix: widen its cpuset (docker update --cpuset-cpus).

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5** on the first try; reversed quiet in 5.'
- '**1 false alarm in 342 other runs**: one `code_event_loop_block` run, where the blocked Node process ran on few
  CPUs.'
- '**A container that uses little CPU is not judged** (0.2 cores, 8 threads).'
