# Blueprint 35 as a structure (26-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: code_thread_leak
fault_type: code_thread_leak
title: one process starts threads that never end (a thread leak)
problem_class: Resource leak (a code defect)
confirms: One process keeps starting threads and none of them ends, so its thread count only grows while it works
  normally.
evidence: An LTTng kernel trace only, with `sched_process_fork` and `sched_process_exit`
not_used: Logs, metrics, spans, source code
when_to_use: A service's thread count or memory climbs slowly with no other symptom; or it later fails to start
  a thread.
status: Calibrated on its 5 v3 runs; tested on all 20 group-2 runs. Not yet checked on the earlier 349 runs. Not
  run by an agent yet.
background: 'Programs start threads all the time: a Java service here starts about 75-85 per second when nothing
  is

  wrong, and ends as many. `thread_growth.py` counts per process the threads started and the threads that

  ended. A leak starts threads and ends none.


  | | `code_thread_leak` (catalogue) | a busy Java service (orders) |

  |---|---|---|

  | started in 10 s | **40-42** | 749-854 |

  | ended | **0** | all but 0-1 |

  | net, baseline | 0 | 0-1 |

  '
lookalikes: 'A busy service that starts and ends threads: high start rate, net about 0.

  A pile-up behind a frozen dependency: threads started per waiting request that end later (blueprint 15).

  Short-lived helper processes (`docker exec`, `runc`): new processes, not threads; up to 11 per slice here.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  thread_growth.py:
    does: Threads started and ended per process; the verdict
    usage: thread_growth.py <baseline_slice> <fault_slice> <secs>
vars:
  EV: sched_process_fork|sched_process_exit
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the 10 s suspect slice, HH:MM:SS
  base_time: start of the 10 s baseline slice, HH:MM:SS
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 10 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that

      starts 40 s after it, and a baseline slice that starts 30 s before it. If not, take the stretch where the

      rate changes and a stretch before it with the same traffic. Both slices are 10 s.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Count threads started and ended per process.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 10 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 10 $WORK/f.txt $EV
    - thread_growth.py $WORK/b.txt $WORK/f.txt 10
    read: 'One row per process and one VERDICT line.

      '
    sets: []
    budget: 5
    outcomes:
      leak:
        when: the tool reads THREADS ARE STARTED AND NOT ENDED
        line: 'VERDICT: THREADS ARE STARTED AND NOT ENDED'
        verdict: confirmed
        fault_type: code_thread_leak
        next: report
      none:
        when: the tool reads NO THREAD GROWTH
        line: 'VERDICT: NO THREAD GROWTH'
        stop: No process keeps its threads. Not this fault.
report: 'fault_type: code_thread_leak. The process on the verdict line. Fix: give every started thread a way to
  end; do

  not lock goroutines to threads. The trace cannot name the code that starts them.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5** (40-42 threads kept in 10 s, 0 before); reversed quiet.'
- '**Quiet on the other 15 group-2 runs**, where orders starts and ends 749-854 threads per slice.'
- '**The margin is small**: 40-42 kept against a bar of 30. A slower leak needs a longer slice.'
- '**Not yet run on the earlier 349 runs.**'
