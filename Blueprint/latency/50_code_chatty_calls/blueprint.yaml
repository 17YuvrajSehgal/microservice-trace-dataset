# Blueprint 50 as a structure (28-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: code_chatty_calls
fault_type: code_chatty_calls
title: a caller makes several calls where one would do, and slows the callee
problem_class: Code defect (call pattern)
confirms: A service makes extra identical calls to another service for each request it receives; the callee gets
  several times the load and its answers slow down.
evidence: An LTTng kernel trace only
not_used: Logs, metrics, spans, source code
when_to_use: One service's request rate multiplied with no more users, and its answers got slower at the same time.
status: Calibrated on its 5 v3 runs; tested on all 50 runs of groups 5-7. Not yet checked on the earlier runs. Not
  run by an agent yet.
background: '`call_fanout.py` divides the calls a client makes to each server by the requests the client itself
  received. With `--slower-ok`

  it also gives a verdict when that number at least doubles AND the answers get slower.


  | | this fault | the same pair before |

  |---|---|---|

  | calls to the catalogue per request received | **2.1-2.3** | 0.6 |

  | calls per second to the catalogue | 551-606 | 219-234 |

  | time per answer | 14.76-17.02 ms | 1.81-1.93 ms |

  '
lookalikes: 'N+1 queries (blueprint 23): calls per request rise and the answers are NOT slower; that is the tool''s
  rule without the flag.

  A retry storm: a slow server that is called again would give the same line. We have no such runs, so the tool
  says ''either the extra calls slow the server, or a slow server is being called again''. Check which came first.

  More users: calls per second rise, calls per request do not.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  call_fanout.py:
    does: Calls per received request to each dependency, and the answer time; the verdict
    usage: call_fanout.py <fault_slice> <secs> [baseline_slice] [--slower-ok]
vars:
  EV: net_dev_queue
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the suspect slice, HH:MM:SS
  base_time: start of the baseline slice, HH:MM:SS
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 20 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that
      starts 40 s after it.

      The baseline slice is the same length, just before the suspect time, with the same traffic. Both must lie
      inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Run the tool on the two slices.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 20 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 20 $WORK/f.txt $EV
    - call_fanout.py $WORK/f.txt 20 $WORK/b.txt --slower-ok
    read: 'One table and one VERDICT line.

      '
    sets: []
    budget: 5
    outcomes:
      'yes':
        when: the tool reads MORE CALLS PER REQUEST AND SLOWER ANSWERS
        line: 'VERDICT: MORE CALLS PER REQUEST AND SLOWER ANSWERS'
        verdict: confirmed
        fault_type: code_chatty_calls
        next: report
      'no':
        when: the tool reads NO CALL AMPLIFICATION
        line: 'VERDICT: NO CALL AMPLIFICATION'
        stop: Calls per received request did not double. Not this fault.
report: 'fault_type: code_chatty_calls. Copy the VERDICT line. Fix: make one call per request and reuse its answer.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5**; reversed quiet.'
- '**Quiet on the other 45 runs** (largest rise 1.21 times).'
- '**The `--slower-ok` rule was added after run 1**; see RESULTS. Without the flag the tool is unchanged, so blueprint
  23''s results hold.'
- '**Not tested against a retry storm** (no such runs).'
- '**Not yet run on the earlier runs.**'
