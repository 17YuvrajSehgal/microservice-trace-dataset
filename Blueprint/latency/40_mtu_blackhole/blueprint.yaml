# Blueprint 40 as a structure (27-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: mtu_blackhole
fault_type: mtu_blackhole
title: large packets to one service are dropped and small ones pass (an MTU black hole)
problem_class: Network (packet size)
confirms: A link in front of one service has a smaller MTU than the service and drops larger packets silently, so
  only small exchanges get through.
evidence: An LTTng kernel trace only, with `net_dev_queue`
not_used: Logs, metrics, spans, source code
when_to_use: A service fails or hangs on some requests while others work, with no CPU or memory problem.
status: Calibrated on its 5 v3 runs; tested on all 20 group-4 runs. The rule was changed twice after seeing the
  5 runs. Not yet checked on the earlier runs. Not run by an agent yet.
background: 'A lost packet is sent again with the same sequence number and size. `big_resends.py` counts, per path
  and per

  interface, the segments that leave more than once, and the smallest size among them (the cut-off). An MTU black

  hole resends only segments above a size; normal loss resends segments of every size, down to 5 bytes.


  | | this fault, path into the catalogue | normal resends elsewhere |

  |---|---|---|

  | resends in 10 s | 146-149 | up to 356 |

  | smallest resent segment | **596-625 bytes** | 5 bytes |

  | smaller segments resent | **0%** | |


  The drops show only in the FIRST seconds: after that the catalogue''s circuit breaker stops it from querying its

  database at all, and nothing large is sent. Take the suspect slice at the start of the fault.

  '
lookalikes: 'Packet loss on a link (`svc_net`, `anomaly_net`): resends of every size.

  A service that stopped answering: no resends, silence (the slow-client blueprint).

  The service''s own errors: they follow the drops (circuit breaker, 5xx), see the logs blueprint.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  big_resends.py:
    does: Resent segments per path, the size cut-off; the verdict
    usage: big_resends.py <fault_slice> <secs> <baseline_slice>
vars:
  EV: net_dev_queue
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the suspect slice, HH:MM:SS
  base_time: start of the baseline slice, HH:MM:SS
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 10 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that
      STARTS at it: the drops are in the first seconds.

      The baseline slice is the same length, just before the suspect time, with the same traffic. Both must lie
      inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Count resent segments per path and the size above which they are resent.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 10 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 10 $WORK/f.txt $EV
    - big_resends.py $WORK/f.txt 10 $WORK/b.txt
    read: 'One row per path and one VERDICT line naming the receiving end.

      '
    sets: []
    budget: 5
    outcomes:
      hole:
        when: the tool reads LARGE PACKETS ARE DROPPED ON ONE PATH
        line: 'VERDICT: LARGE PACKETS ARE DROPPED ON ONE PATH'
        verdict: confirmed
        fault_type: mtu_blackhole
        next: report
      none:
        when: the tool reads NO LARGE-PACKET DROPS
        line: 'VERDICT: NO LARGE-PACKET DROPS'
        stop: No path drops only large packets. Not this fault, or the slice is too late (see Background).
report: 'fault_type: mtu_blackhole. The receiving address on the verdict line and the cut-off size. Fix: make the
  MTU the same on both sides of that link.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5** in a slice at the start of the fault; reversed quiet.'
- '**Quiet on the other 15 group-4 runs.**'
- '**0 of 5 in a slice 40 s into the fault**: the circuit breaker has stopped the traffic by then.'
- '**The rule was changed twice after seeing the 5 runs** (a fixed size cut-off, then a share of resent segments
  that swung from 37% to 78%); see RESULTS.'
- '**Not yet run on the earlier runs.**'
