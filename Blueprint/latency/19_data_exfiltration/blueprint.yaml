# Blueprint 19 as a structure (20-11-2026). The source of BLUEPRINT.md (bp_render.py) and
# of the agent's steps (bp_graph.py). Wording and numbers are those of README_v1.md.

id: data_exfiltration
fault_type: data_exfiltration
title: one process pushes a lot of data out, one way (bulk transfer)
problem_class: Security / capacity (the network is healthy and is being used heavily)
confirms: One process sends a large, steady stream to one destination and almost nothing comes back.
evidence: An LTTng kernel trace only, with `net_dev_queue`
not_used: Logs, metrics, packet contents
when_to_use: >-
  Outbound traffic is well above normal and nothing is broken: no loss, no errors, normal
  latency. Or someone asks "is anything on this host shipping data out?".
status: >-
  Calibrated on 10 labelled `data_exfiltration` runs (5 Sock Shop, 5 Train Ticket; a
  container sending 40 MB/s of generated bytes to a sink container on the same host) and
  checked on the other 293 runs of both applications. The labelled workload is a harmless
  simulation: only the shape is real. Agent (20-11-2026, graph harness, gpt-6-luna): one labelled run, confirmed.

background: |
  Every other network blueprint looks for damage (drops, retransmits, delay). Here there is
  none. What a bulk transfer has is three things together:

  | | bulk transfer | service traffic | telemetry export |
  |---|---|---|---|
  | volume of one stream | **42 MB/s** | under 0.3 MB/s | 1-3 MB/s |
  | payload coming back | **0.0%** | 250-400% (replies are bigger than requests) | 0.1% |
  | flows in every second | **yes** | yes | yes |

  So direction alone is not enough: telemetry export and a database result stream are
  one-way and steady too (largest measured outside the fault: 2.96 MB/s). Volume alone is
  not enough either on a busier system. The verdict needs all three.

  A stream is counted per process and destination, not per host. The host total does not
  transfer between applications (measured earlier: the same transfer is 6x the baseline on
  one application and 25x on the other).

lookalikes: |
  Service traffic: under 0.3 MB/s per stream, and 250-400% comes back (replies are bigger than requests).
  Telemetry export and a database result stream: one-way and steady too, but small (largest measured outside the fault: 2.96 MB/s).
  A losing path (blueprint 5): a path that drops packets also moves many bytes, because it sends the same bytes again.
  A backup or a log shipper: the same shape. The trace cannot say the transfer is unauthorised.

tools:
  idx_summary.py: {does: "Date, span, health", usage: "idx_summary.py <trace_dir> [--rate SECONDS]"}
  extract_slice.sh: {does: "Cuts one slice with the events you name", usage: "extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'"}
  egress.py: {does: "TCP payload per stream, what comes back, the verdict", usage: "egress.py <net_slice> <secs>"}
  net_loss.py: {does: "Rules out a losing path (blueprint 5's tool)", usage: "net_loss.py <net_slice> <secs>"}
  victim_info.py: {does: "Who a pid is", usage: "victim_info.py <sched_slice> <secs> <pid>"}

facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  slice_time: start of the 10 s network slice inside the suspect window, HH:MM:SS only (no date)
  sender: the process on the BULK ONE-WAY TRANSFER verdict line (comm, pid, pid_ns) and the destination
  incident_start: start of the first slice that has the verdict, HH:MM:SS only (no date)

start: check_trace

steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
      - [idx_summary.py, $TRACE]
    extract:
      day: '^date \(UTC\)\s*:\s*(\S+)'
      trace_start: '^trace start\s*:\s*(\d\d:\d\d:\d\d)'
      trace_end: '^trace end\s*:\s*(\d\d:\d\d:\d\d)'
      duration_s: '^duration\s*:\s*([\d.]+)'
      lost_events: '^lost events\s*:\s*(.+)$'
    next: orient

  orient:
    kind: guided
    goal: Pick a time inside the suspect window for one 10 s network slice.
    suggested:
      - idx_summary.py $TRACE --rate 10
    read: |
      The last table is the trace data written per 10 s. Pick a time inside the suspect
      window. If you were given a suspect time, use it. The slice is 10 s and must lie
      inside the trace.
    sets: [slice_time]
    budget: 3
    outcomes:
      time_chosen:
        when: a slice time is chosen
        next: transfer
  # the README gives no rule for a trace with no suspect window; the agent has to choose

  transfer:
    kind: guided
    goal: Find one stream that is large, one-way and steady, and read the verdict.
    suggested:
      - extract_slice.sh $TRACE <day> <slice_time> 10 $WORK/net.txt net_dev_queue
      - egress.py $WORK/net.txt 10
    read: |
      egress.py prints one row per stream and one VERDICT line. A stream is counted per
      process and destination. Columns: `MB/s`, `back` (payload coming back as a share of
      the payload sent), `active` (share of the seconds in which it flows), the sender, and
      the destination. On a NO verdict the table lists the biggest streams.
    sets: [sender]
    budget: 4
    outcomes:
      bulk:
        when: the tool reads BULK ONE-WAY TRANSFER (that process is the sender; the destination is where the data goes)
        line: "VERDICT: BULK ONE-WAY TRANSFER"
        next: losing_path
      none:
        when: the tool reads NO BULK ONE-WAY TRANSFER
        line: "VERDICT: NO BULK ONE-WAY TRANSFER"
        stop: Not this fault. The table above the verdict lists the biggest streams.

  losing_path:
    kind: guided
    goal: Rule out a losing path. A path that drops packets also moves many bytes, because it sends the same bytes again.
    suggested:
      - net_loss.py $WORK/net.txt 10
    read: |
      Run net_loss.py on the same slice. It has no VERDICT line. Look for the line that
      says whether any queue dropped segments. If it reports dropped segments, the case
      goes to blueprint 5 instead.
    sets: []
    budget: 3
    outcomes:
      no_loss:
        when: the tool reports that no queue drops packets
        line: "no queue drops packets here"
        verdict: confirmed
        next: start_time
      one_path_drops:
        when: the tool reports dropped segments, (nearly) all at one sender's queue
        line: "-> the ONE-PATH shape"
        stop: The path drops packets, and a path that drops packets also moves many bytes. Go to blueprint 5 instead.
      host_wide_drops:
        when: the tool reports dropped segments at the queues of several senders
        line: "-> the HOST-WIDE shape"
        stop: Queues drop packets, and a path that drops packets also moves many bytes. Go to blueprint 5 instead.

  start_time:
    kind: guided
    goal: Find when the transfer started.
    suggested:
      - extract_slice.sh $TRACE <day> <slice_time minus 60 s> 10 $WORK/net_m60.txt net_dev_queue
      - egress.py $WORK/net_m60.txt 10
      - extract_slice.sh $TRACE <day> <slice_time minus 120 s> 10 $WORK/net_m120.txt net_dev_queue
      - egress.py $WORK/net_m120.txt 10
    read: |
      Cut the same slice 60 s and 120 s earlier and run egress.py again. The first slice
      with the BULK ONE-WAY TRANSFER verdict is the start of the incident window. A slice
      must lie inside the trace.
    sets: [incident_start]
    budget: 4
    outcomes:
      start_known:
        when: the first slice with the verdict is known
        next: report

report: |
  fault_type: `data_exfiltration`. Root cause: the process and container from the verdict
  line (`comm`, `pid_ns`). Incident window: from the first slice with the verdict to the
  end of your last slice. Evidence: the verdict line word for word. Fix: find out what the
  process is and whether the transfer is expected; then throttle or block it. The trace
  cannot say the transfer is unauthorised: the verdict names the shape; a person decides.

measured:
  - "Per-run lines: `RESULTS.md` next to this file. 10 of 10 labelled runs, 0 false alarms in 293 other runs. Smallest labelled stream 41.9 MB/s; largest steady one-way stream elsewhere 2.96 MB/s (a proxy relaying database results on Train Ticket)."
  - "**The 5 MB/s bar is not safe for a slow transfer.** The recipe has a 5 MB/s setting that was never collected. It would sit on the bar, less than 2x above normal telemetry. A slow leak needs a baseline (the same stream an hour earlier), which this tool does not do."
  - "**The trace cannot say the transfer is unauthorised.** A backup or a log shipper has the same shape. The verdict names the shape; a person decides."
  - "Only TCP over IPv4 is counted. A transfer over UDP or IPv6 is not seen."
  - "In the labelled runs the destination is a container on the same host. A real destination off the host shows the same events on the outgoing interface, but that path was not measured."
