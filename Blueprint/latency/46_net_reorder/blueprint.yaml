# Blueprint 46 as a structure (28-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: net_reorder
fault_type: net_reorder
title: packets of one sender leave out of order
problem_class: Network (path)
confirms: The path after one sender delivers its packets in another order, so TCP sees the signs of loss with nothing
  lost.
evidence: An LTTng kernel trace only
not_used: Logs, metrics, spans, source code
when_to_use: One service's answers got slower and it resends data, but no packet is dropped anywhere.
status: Calibrated on its 5 v3 runs; tested on all 50 runs of groups 5-7. Not yet checked on the earlier runs. Not
  run by an agent yet.
background: 'A packet from a container is seen on its own interface and again on the next hop. `pkt_order.py` counts
  data segments that

  reach an interface for the first time after a later segment of the same connection.


  | | this fault | normal |

  |---|---|---|

  | late data segments in 20 s | **165-199 of 15,677-16,430 (1.0-1.2%)** | 0-2 |

  | segments sent more than once | 56-69 | |


  The share is small because most answers are one segment long, and one segment cannot be out of order.

  '
lookalikes: 'Packet loss (blueprints 5 and 7): segments are sent twice and none arrives late; resends are not counted
  as late.

  A constant delay (blueprint 51) or a rate limit (blueprint 32): the order is kept.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  pkt_order.py:
    does: Late data segments per sender and interface; the verdict
    usage: pkt_order.py <fault_slice> <secs> [baseline_slice]
vars:
  EV: net_dev_queue
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the suspect slice, HH:MM:SS
  base_time: start of the baseline slice, HH:MM:SS
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 20 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that
      starts 40 s after it.

      The baseline slice is the same length, just before the suspect time, with the same traffic. Both must lie
      inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Run the tool on the two slices.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 20 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 20 $WORK/f.txt $EV
    - pkt_order.py $WORK/f.txt 20 $WORK/b.txt
    read: 'One table and one VERDICT line.

      '
    sets: []
    budget: 5
    outcomes:
      'yes':
        when: the tool reads PACKETS LEAVE OUT OF ORDER
        line: 'VERDICT: PACKETS LEAVE OUT OF ORDER'
        verdict: confirmed
        fault_type: net_reorder
        next: report
      'no':
        when: the tool reads NO REORDERING
        line: 'VERDICT: NO REORDERING'
        stop: No sender's packets arrive out of order. Not this fault.
report: 'fault_type: net_reorder. Copy the VERDICT line. Fix: remove the reordering on the path (here: `tc qdisc
  del` in the sender''s network namespace).

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5**; reversed quiet.'
- '**Quiet on the other 45 runs** (at most 2 late segments).'
- '**The share bar was lowered after run 1** (from 2% to 0.5%); see RESULTS.'
- '**Not yet run on the earlier runs.**'
