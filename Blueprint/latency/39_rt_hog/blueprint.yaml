# Blueprint 39 as a structure (27-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: rt_hog
fault_type: rt_hog
title: one CPU is held by a real-time task
problem_class: CPU (scheduling policy)
confirms: A task with a real-time policy spins on one CPU, so normal threads on that CPU get only what the kernel's
  real-time throttling leaves.
evidence: An LTTng kernel trace only, with `sched_switch`
not_used: Logs, metrics, spans, source code
when_to_use: One CPU is busy all the time with no service using more CPU; or threads pinned to one CPU slow down.
status: Calibrated on its 5 v3 runs; tested on all 20 group-4 runs. Not yet checked on the earlier runs. Not run
  by an agent yet.
background: 'A real-time task (SCHED_FIFO or SCHED_RR) always runs before normal tasks on its CPU. LTTng prints
  its priority as a

  negative number (normal tasks are 0-39). `rt_cpu.py` adds up, per CPU, the time the running task had a negative

  priority and was not a kernel thread (migration, watchdog and other kernel helpers are real-time too).


  | | this fault | normal |

  |---|---|---|

  | one CPU held by a user real-time task | **88-98% of the slice** | 0% |

  | task | `python3`, priority -51 | |

  | services | no change in rate, errors or answer time | |

  '
lookalikes: 'A busy normal process on one CPU: priority 0-39, the scheduler shares the CPU.

  Kernel real-time threads (migration/N, priority -100): left out by name.

  A CPU quota or a low CPU weight: waits in one container, not one CPU held.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  rt_cpu.py:
    does: Time each CPU ran a user real-time task; the verdict
    usage: rt_cpu.py <baseline_slice> <fault_slice> <secs>
vars:
  EV: sched_switch
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the suspect slice, HH:MM:SS
  base_time: start of the baseline slice, HH:MM:SS
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 10 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that
      starts 40 s after it.

      The baseline slice is the same length, just before the suspect time, with the same traffic. Both must lie
      inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Measure the time each CPU ran a user real-time task.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 10 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 10 $WORK/f.txt $EV
    - rt_cpu.py $WORK/b.txt $WORK/f.txt 10
    read: 'One row per CPU and one VERDICT line naming the task.

      '
    sets: []
    budget: 5
    outcomes:
      held:
        when: the tool reads A REAL-TIME TASK HOLDS A CPU
        line: 'VERDICT: A REAL-TIME TASK HOLDS A CPU'
        verdict: confirmed
        fault_type: rt_hog
        next: report
      none:
        when: the tool reads NO CPU HELD BY A REAL-TIME TASK
        line: 'VERDICT: NO CPU HELD BY A REAL-TIME TASK'
        stop: No CPU is held by a user real-time task. Not this fault.
report: 'fault_type: rt_hog. The task and CPU on the verdict line. Fix: stop it, or give it the normal policy (chrt
  -o -p 0 <pid>).

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5** (88-98% of the slice, 0% before); reversed quiet.'
- '**Quiet on the other 15 group-4 runs.**'
- '**No service was slowed** at this load: the tasks on that CPU moved to others. This is a kernel and host-metric
  family.'
- '**Not yet run on the earlier runs.**'
