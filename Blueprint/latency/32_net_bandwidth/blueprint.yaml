# Blueprint 32 as a structure (25-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: net_bandwidth
fault_type: net_bandwidth
title: packets wait at one container's interface (a rate limit, or a fixed delay)
problem_class: Network (a queue on one interface)
confirms: 'One container''s interface holds its outgoing packets: a rate limit when it sends more than the limit,
  or a fixed delay on every packet.'
evidence: An LTTng kernel trace only, with `net_dev_queue`
not_used: Logs, metrics, spans, source code
when_to_use: One service is slower for its callers while its CPU, its threads and its dependencies look normal.
status: Calibrated on the 5 v3 `net_bandwidth` runs (catalogue limited to 2 Mbit/s). Checked on all 347 runs. The
  rate-or-delay rule was set after the sweep. Not run by an agent yet.
background: 'A packet is queued on the sender''s interface and then on the next interface. `dev_delay.py` measures
  the

  time between the two sightings, per sender. Normally it is about 0.01 ms.


  How the wait is spread tells the kind:


  | | rate limit (this fault) | fixed delay (`svc_net`, `anomaly_net`) |

  |---|---|---|

  | median wait | 62-76 ms | 78-81 ms or 149-153 ms |

  | p95 / median | **4.5-5.3** | **1.4-1.6** |

  '
lookalikes: 'A fixed delay with jitter (netem): every packet waits about the same time.

  A slow receiver: the sender''s packets leave at once; the wait is elsewhere.

  A busy service: packets leave as soon as they are written.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  dev_delay.py:
    does: Wait at the sender's interface, per sender; verdict and kind
    usage: dev_delay.py <fault_slice> <secs> <baseline_slice>
vars:
  EV: net_dev_queue|sched_switch|sched_waking|sched_wakeup
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the 20 s suspect slice, HH:MM:SS
  base_time: start of the 20 s baseline slice, HH:MM:SS
  culprit: the container on the verdict line
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 20 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that

      starts 30 s after it, and a baseline slice that ends 20 s before it. If not, take the stretch where the rate

      changes and a stretch before it with the same traffic. Both slices are 20 s and must lie inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Measure how long each sender's packets wait at its own interface.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 20 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 20 $WORK/f.txt $EV
    - dev_delay.py $WORK/f.txt 20 $WORK/b.txt
    read: 'One row per sender and one VERDICT line per sender that waits; its KIND part says rate limit or fixed
      delay.

      '
    sets: []
    budget: 5
    outcomes:
      limit:
        when: the verdict's KIND is A RATE LIMIT OR A FULL QUEUE
        line: 'KIND: A RATE LIMIT OR A FULL QUEUE'
        verdict: confirmed
        fault_type: net_bandwidth
        next: report
      delay:
        when: the verdict's KIND is A FIXED DELAY
        line: 'KIND: A FIXED DELAY'
        stop: A fixed delay on that interface, not a rate limit (network impairment, see the netem blueprints).
      none:
        when: the tool reads NO PACKETS WAITING AT A SENDER'S INTERFACE
        line: 'VERDICT: NO PACKETS WAITING AT A SENDER''S INTERFACE'
        stop: No interface holds packets. Not this fault.
report: 'fault_type: net_bandwidth. The sender on the verdict line; the limit is about what it sent. Fix: raise
  or remove

  the rate limit on that interface.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5** on the first try; reversed quiet.'
- '**Other runs with a wait at an interface: 21**, all faults that put a delay queue on an interface (`svc_net`
  10, `anomaly_net` 11). The KIND rule separates them: p95/median 1.4-1.6 there, 4.5-5.3 here.'
- '**The KIND bars were chosen after seeing those numbers**, from the sweep''s verdict lines.'
- '**0 of 20 normal runs.**'
