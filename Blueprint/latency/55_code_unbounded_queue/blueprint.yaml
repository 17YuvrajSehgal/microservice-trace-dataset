# Blueprint 55 as a structure (28-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: code_unbounded_queue
fault_type: code_unbounded_queue
title: a client releases its calls from a timer (an in-process queue)
problem_class: Code defect (queueing)
confirms: A service puts its calls to other services in an in-process queue that a timer drains at a fixed rate;
  when more arrive, they wait in the queue.
evidence: An LTTng kernel trace only
not_used: Logs, metrics, spans, source code
when_to_use: A service got slower while its dependencies answer as fast as before and its CPU did not rise.
status: Calibrated on its 5 v3 runs; tested on all 70 runs of groups 5-8. Not yet checked on the earlier runs. Not
  run by an agent yet.
background: '`paced_calls.py` looks at the gaps between the calls a client sends to one server. Calls that follow
  requests come in

  bursts, with gaps of every length. Calls released by a timer leave on its clock: one gap length becomes common.


  | | this fault (front-end to catalogue) | the same pair before |

  |---|---|---|

  | gaps of 8.0 to 11.0 ms | **17-20% of all gaps** | 4-5% |

  | the timer | about 10 ms | |


  The front-end''s p50 rises from about 70 to about 147 ms (collection check). Its memory does not grow: the 150
  users

  wait for their answers, so the queue cannot grow without limit.

  '
lookalikes: 'A queue served by a pool of workers that never sleep: no clock, not seen by this tool.

  Busy traffic: most gaps are short; the peak must be a bump at 4 ms or more.

  A lock held across a call (blueprint 25): calls stop overlapping, no clock.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  paced_calls.py:
    does: Gaps between calls per client and server; the verdict
    usage: paced_calls.py <fault_slice> <secs> <baseline_slice>
vars:
  EV: net_dev_queue
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the suspect slice, HH:MM:SS
  base_time: start of the baseline slice, HH:MM:SS
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 20 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that
      starts 40 s after it.

      The baseline slice is the same length, just before the suspect time, with the same traffic. Both must lie
      inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Run the tool on the two slices.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 20 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 20 $WORK/f.txt $EV
    - paced_calls.py $WORK/f.txt 20 $WORK/b.txt
    read: 'One table and one VERDICT line.

      '
    sets: []
    budget: 5
    outcomes:
      'yes':
        when: the tool reads CALLS LEAVE ON A CLOCK
        line: 'VERDICT: CALLS LEAVE ON A CLOCK'
        verdict: confirmed
        fault_type: code_unbounded_queue
        next: report
      'no':
        when: the tool reads NO PACED CALLS
        line: 'VERDICT: NO PACED CALLS'
        stop: No client sends its calls on a clock. Not this fault (a queue without a timer is not seen).
report: 'fault_type: code_unbounded_queue. Copy the VERDICT line. Fix: bound the queue and shed load when it is
  full; size the worker to the arrival rate.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5**; reversed quiet.'
- '**Quiet on the other 65 runs.**'
- '**Changed after the first 70-run test**: the server of a connection is now the side with a port below 32768 (the
  first version sometimes took the server for the client). Also changed then: the clock is looked for from 4 ms
  and must be a bump (one reversed run had fired on busy traffic).'
- '**It sees a queue only when a timer drains it.**'
- '**Not yet run on the earlier runs.**'
