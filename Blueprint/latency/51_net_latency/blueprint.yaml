# Blueprint 51 as a structure (28-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: net_latency
fault_type: net_latency
title: every packet of one sender waits one fixed time
problem_class: Network (path)
confirms: 'Every packet a service sends waits the same fixed time at its own interface: a longer path, with no loss
  and no jitter.'
evidence: An LTTng kernel trace only
not_used: Logs, metrics, spans, source code
when_to_use: One service and its callers got slower by a steady amount, with no resends and no errors.
status: Calibrated on its 5 v3 runs; tested on all 50 runs of groups 5-7. Not yet checked on the earlier runs. Not
  run by an agent yet.
background: '`dev_delay.py` (from blueprint 32) measures how long a packet waits between its sender''s interface
  and the next hop.


  | | this fault | normal |

  |---|---|---|

  | wait at the sender''s interface | **20 ms median and 20 ms p95** | 0.01 ms |

  | packets measured in 20 s | 32,170-33,571 | |

  | the tool''s KIND | A FIXED DELAY | |


  The service''s own answer time rises too (span p50 1.5 to 43 ms): the delay also sits on its calls to its database.

  '
lookalikes: 'A rate limit (blueprint 32): the same verdict with KIND ''a rate limit or a full queue''; the wait
  varies.

  Reordering (blueprint 46): only part of the packets wait, and the tool stays quiet.

  Delay with loss (blueprint 5): packets are also sent again.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  dev_delay.py:
    does: Wait at the sender's interface per sending address; the verdict and its KIND
    usage: dev_delay.py <fault_slice> <secs> [baseline_slice]
vars:
  EV: net_dev_queue
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the suspect slice, HH:MM:SS
  base_time: start of the baseline slice, HH:MM:SS
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 20 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that
      starts 40 s after it.

      The baseline slice is the same length, just before the suspect time, with the same traffic. Both must lie
      inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Run the tool on the two slices.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 20 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 20 $WORK/f.txt $EV
    - dev_delay.py $WORK/f.txt 20 $WORK/b.txt
    read: 'One table and one VERDICT line.

      '
    sets: []
    budget: 5
    outcomes:
      'yes':
        when: the tool reads PACKETS WAIT AT THE SENDER'S INTERFACE
        line: 'VERDICT: PACKETS WAIT AT THE SENDER''S INTERFACE'
        verdict: confirmed
        fault_type: net_latency
        next: report
      'no':
        when: the tool reads NO PACKETS WAITING AT A SENDER'S INTERFACE
        line: 'VERDICT: NO PACKETS WAITING AT A SENDER''S INTERFACE'
        stop: No sender's packets wait at its interface. Not this fault.
report: 'fault_type: net_latency. Copy the VERDICT line. Fix: remove the delay on the path (here: `tc qdisc del`
  in the sender''s network namespace). Confirm the KIND reads A FIXED DELAY.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5**, each with KIND: A FIXED DELAY; reversed quiet.'
- '**Quiet on the other 45 runs**, including the 5 `net_reorder` runs.'
- '**The tool is unchanged from blueprint 32.** Nothing was fitted to this family.'
- '**Not yet run on the earlier runs.**'
