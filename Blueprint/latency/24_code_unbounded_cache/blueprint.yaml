# Blueprint 24 as a structure (20-11-2026). The source of BLUEPRINT.md (bp_render.py) and
# of the agent's steps (bp_graph.py). Wording and numbers are those of README_v1.md.

id: code_unbounded_cache
fault_type: code_unbounded_cache
title: the memory of one process only grows (a leak, or a cache with no limit)
problem_class: Resource leak (a code defect)
confirms: One process keeps taking memory from the kernel in every second and gives little back, while it does its normal work.
evidence: An LTTng kernel trace only, with the `brk`, `mmap`, `munmap` system calls and `sched_process_fork`
not_used: Logs, metrics, source code
when_to_use: >-
  Nothing is slow or failing yet. A container's memory use climbs for as long as traffic
  arrives, or a service was killed for memory and nobody knows what filled it.
status: >-
  Calibrated on the 5 labelled `code_unbounded_cache` runs (Sock Shop front-end: 64 kB kept
  per request, never freed) and checked on all other v2 runs. Two rules were added after
  sweeps (see Measured). Agent (20-11-2026, graph harness, gpt-6-luna): one labelled run confirmed, one run of another fault rejected.

background: |
  A process gets memory with `mmap` (a new region) or `brk` (a longer heap) and returns it
  with `munmap`. The tool adds these up per process and per second.

  | | this fault | a healthy JVM | a JVM whose dependency is frozen |
  |---|---|---|---|
  | net growth in 30 s | **413-431 MB** | 17-29 MB | 312-344 MB |
  | share of the seconds with growth | 100% | 90-100% | 100% |
  | kept, of what it asked for | **21-22%** | 1% | 21% |
  | threads started in the 30 s | **0** | few | 1,470-1,616 |

  So growth alone is not enough. A garbage-collected runtime asks for and returns gigabytes
  and keeps almost nothing. And a service whose requests pile up starts a thread per
  request, and each thread maps a stack: its memory grows, but nothing leaks.

lookalikes: |
  A healthy garbage-collected runtime: large requests, almost all returned (keeps about 1%).
  A service whose dependency is frozen: memory grows with the threads it starts (blueprint 15).
  One large request at once (a stress tool, a restarted JVM): the growth is in one second, not steady.

tools:
  idx_summary.py: {does: "Date, span, health", usage: "idx_summary.py <trace_dir> [--rate SECONDS]"}
  extract_slice.sh: {does: "Cuts one slice with the events you name", usage: "extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'"}
  mem_growth.py: {does: "Net memory taken per process, per second; the verdict", usage: "mem_growth.py <slice> <secs>"}
  victim_info.py: {does: "Who a pid is", usage: "victim_info.py <sched_slice> <secs> <pid>"}

vars:
  MEMSYS: syscall_exit_brk|syscall_entry_mmap|syscall_entry_munmap|sched_process_fork

facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  slice_time: start of the 30 s slice inside the suspect window, HH:MM:SS only (no date)
  leak_process: the process on the verdict line (comm, pid, pid_ns)

start: check_trace

steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
      - [idx_summary.py, $TRACE]
    extract:
      day: '^date \(UTC\)\s*:\s*(\S+)'
      trace_start: '^trace start\s*:\s*(\d\d:\d\d:\d\d)'
      trace_end: '^trace end\s*:\s*(\d\d:\d\d:\d\d)'
      duration_s: '^duration\s*:\s*([\d.]+)'
      lost_events: '^lost events\s*:\s*(.+)$'
    next: orient

  orient:
    kind: guided
    goal: Pick a time inside the suspect window for one 30 s slice.
    suggested:
      - idx_summary.py $TRACE --rate 10
    read: |
      The last table is the trace data written per 10 s. With this fault nothing is slow
      yet, so the rate may show no change at all. If you were given a suspect time, use it.
      If the rate changes, take a time inside the changed stretch. If nothing changes, take
      a time in the middle of the trace. The slice is 30 s and must lie inside the trace.
    sets: [slice_time]
    budget: 3
    outcomes:
      time_chosen:
        when: a slice time is chosen
        next: measure

  measure:
    kind: guided
    goal: Measure the net memory each process took from the kernel, per second, and read the verdict.
    suggested:
      - extract_slice.sh $TRACE <day> <slice_time> 30 $WORK/mem.txt $MEMSYS
      - mem_growth.py $WORK/mem.txt 30
    read: |
      mem_growth.py prints one row per process and one VERDICT line. To see that the
      growth is tied to the fault, you may run the same check on a slice before the window.
      The tool sees what is asked from the kernel, not what is used: memory a runtime takes
      once and reuses inside shows no growth here.
    sets: []
    budget: 5
    outcomes:
      leak:
        when: the tool reads MEMORY ONLY GROWS for one process
        line: "VERDICT: MEMORY ONLY GROWS"
        verdict: confirmed
        next: report
      pile_up:
        when: the tool reads MEMORY GROWS WITH NEW THREADS (requests are piling up; this is not a leak)
        line: "VERDICT: MEMORY GROWS WITH NEW THREADS"
        stop: Not a leak. The process starts a thread per waiting request; find what it waits for.
        handoff: 15_dependency_outage
      no_growth:
        when: the tool reads NO STEADY MEMORY GROWTH
        line: "VERDICT: NO STEADY MEMORY GROWTH"
        stop: No process has steady memory growth. Not this fault.

report: |
  fault_type: code_unbounded_cache. The root cause process is the one on the verdict line
  (comm, pid, pid_ns). Evidence: the verdict line word for word. Fix: bound the cache and
  evict entries. The trace cannot name the data structure.

measured:
  - "Per-run lines: `RESULTS.md` next to this file."
  - "**5 of 5 fault runs, 0 false alarms in 297 other runs** (final rule). The 5 `dependency_outage` runs get the \"new threads\" verdict."
  - "**Two rules were added after sweeps.** (1) The process must keep 10% of what it asked for; without it one JVM fired in 97 other Sock Shop runs (17-29 MB kept of about 2 GB asked). (2) Growth of up to 2 MB per thread started is a pile-up; without it the 5 `dependency_outage` runs fired. Rule (2) was applied to the saved outputs of job 2880078, not run again on the slices."
  - "**It sees what is asked from the kernel, not what is used.** Memory a runtime takes once and reuses inside (a JVM heap at its full size) shows no growth here even if the program leaks objects inside it. A JVM also returns memory by remapping it without access, which this tool does not count."
  - "**A slow leak is below the bar.** The bar is 0.5 MB/s; this defect is 14 MB/s."
  - "**One defect in one runtime** (Node). Not tested on a leaking Go or Java service."
