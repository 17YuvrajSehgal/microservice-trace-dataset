# Blueprint 33 as a structure (25-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: cpu_weight
fault_type: cpu_weight
title: one container waits for CPU far more than the others (a low CPU weight on a busy host)
problem_class: CPU (a share)
confirms: One container has a very low CPU weight on a busy host, so its threads wait for a core much longer than
  before while other containers do not.
evidence: An LTTng kernel trace only, with the scheduling events
not_used: Logs, metrics, spans, source code
when_to_use: One service is slow on a busy host, with no CPU quota and all CPUs available to it.
status: Calibrated on the 5 v3 `cpu_weight` runs (carts at weight 10, a 12-process neighbour). Bars set from the
  sweep's numbers; the tool itself was run only on the v3 slices. Not run by an agent yet.
background: 'For each container `cpu_starved.py` divides the time its threads wait for a core by the time they run

  (wait per core). A starved container waits several seconds for every second of work, much more than

  before, while the other containers'' numbers do not change.


  | | this fault | a CPU quota | a small cpuset | host-wide CPU stress |

  |---|---|---|---|---|

  | wait per core | **10.6-19.8** | 29-31 | 1.9-2.4 | 1.2-1.6 |

  | others change | **0.7-0.8 times** | | | everybody waits |

  '
lookalikes: 'A CPU quota (`svc_cpu_cap` aggressive): the same picture with a higher number. Check for a 100 ms ceiling
  first.

  A small cpuset: lower wait per core; `cpu_confine.py` names it (blueprint 26).

  Host-wide CPU stress: every container waits more.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  cpu_starved.py:
    does: Wait per core, per container, before and now; the verdict
    usage: cpu_starved.py <baseline_slice> <fault_slice> <secs>
  cpu_confine.py:
    does: The scheduler reader it uses; also blueprint 26
    usage: cpu_confine.py <baseline_slice> <fault_slice> <secs>
vars:
  EV: sched_switch|sched_waking|sched_wakeup
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the 20 s suspect slice, HH:MM:SS
  base_time: start of the 20 s baseline slice, HH:MM:SS
  culprit: the container on the verdict line
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 20 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that

      starts 30 s after it, and a baseline slice that ends 20 s before it. If not, take the stretch where the rate

      changes and a stretch before it with the same traffic. Both slices are 20 s and must lie inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Compare each container's wait for a core per second of work, before and now.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 20 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 20 $WORK/f.txt $EV
    - cpu_starved.py $WORK/b.txt $WORK/f.txt 20
    read: 'One row per container and one VERDICT line. The verdict cannot tell a low weight from a CPU quota: if
      the

      service''s CPU use sits flat at a round number of cores in bursts, it is a quota.

      '
    sets: []
    budget: 5
    outcomes:
      starved:
        when: the tool reads ONE CONTAINER IS STARVED OF CPU
        line: 'VERDICT: ONE CONTAINER IS STARVED OF CPU'
        verdict: confirmed
        fault_type: cpu_weight
        next: report
      none:
        when: the tool reads NO CONTAINER STARVED OF CPU
        line: 'VERDICT: NO CONTAINER STARVED OF CPU'
        stop: No single container waits for CPU much more than before. Not this fault.
report: 'fault_type: cpu_weight. The container on the verdict line. Evidence: its wait per core before and now,
  and the

  others'' change. Fix: give it its normal CPU weight. Check for a CPU quota before reporting.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5**; reversed quiet in 5.'
- '**Quiet on the 15 other v3 slices tested** (`db_table_lock`, `slow_client`, `net_bandwidth`).'
- '**Not yet run on the 347 sweep runs.** From the same numbers in the sweep''s tables: a CPU quota (`svc_cpu_cap`,
  3 aggressive runs) would fire; normal runs stay at most 1.17.'
- '**Its baseline is a busy host**, not comparable with the other families.'
