# Blueprint 56 as a structure (28-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: syn_flood
fault_type: syn_flood
title: a stream of connection attempts that are never completed (SYN flood)
problem_class: Security (denial of service)
confirms: Someone sends connection attempts (SYN) to one port from an address that never completes them; the server
  keeps answering and waiting.
evidence: An LTTng kernel trace only
not_used: Logs, metrics, spans, source code
when_to_use: A service's port gets very many new connection attempts, or its listen queue is full, with few real
  clients more.
status: Calibrated on its 5 v3 runs; tested on all 70 runs of groups 5-8. Not yet checked on the earlier runs. Not
  run by an agent yet.
background: '`half_open.py` counts, per source and server port, the connection attempts and how many the source
  later confirmed.

  Real clients confirm almost all of theirs. The server''s answers to a false address may not be sent at all (the
  address

  cannot be resolved), so they are not needed.


  | | this fault | normal |

  |---|---|---|

  | attempts from one source to one port in 20 s | **201,280-205,360 (about 10,100 per second)** | at most 7,796
  |

  | completed | 0% | 100% |


  SYN cookies stay on, so real users are hardly hurt; under tracing the front-end''s p95 still rose 30-75 ms.

  '
lookalikes: 'A port scan (blueprint 34): many ports, refused; here one port, never answered.

  Connection churn (blueprint 45): many attempts, all completed.

  A busy client pool: all completed.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  half_open.py:
    does: Connection attempts per source and server port, and how many completed; the verdict
    usage: half_open.py <fault_slice> <secs> [baseline_slice]
vars:
  EV: net_dev_queue
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the suspect slice, HH:MM:SS
  base_time: start of the baseline slice, HH:MM:SS
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 20 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that
      starts 40 s after it.

      The baseline slice is the same length, just before the suspect time, with the same traffic. Both must lie
      inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Run the tool on the two slices.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 20 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 20 $WORK/f.txt $EV
    - half_open.py $WORK/f.txt 20 $WORK/b.txt
    read: 'One table and one VERDICT line.

      '
    sets: []
    budget: 5
    outcomes:
      'yes':
        when: the tool reads CONNECTION ATTEMPTS ARE NEVER COMPLETED
        line: 'VERDICT: CONNECTION ATTEMPTS ARE NEVER COMPLETED'
        verdict: confirmed
        fault_type: syn_flood
        next: report
      'no':
        when: the tool reads NO HALF-OPEN FLOOD
        line: 'VERDICT: NO HALF-OPEN FLOOD'
        stop: No stream of uncompleted attempts. Not this fault.
report: 'fault_type: syn_flood. Copy the VERDICT line. Fix: block the source and keep SYN cookies on.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5**; reversed quiet.'
- '**Quiet on the other 65 runs.**'
- '**The bars were set before the test and not changed**; run 1 was only looked at to see that the attempts are
  in the trace.'
- '**Not yet run on the earlier runs.**'
