# Blueprint 27 as a structure (25-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: disk_full
fault_type: disk_full
title: a container's disk is full (writes fail with no space)
problem_class: Resource limit (an error return)
confirms: The volume of one container is full, so its writes or file growth fail with -28 and the program crashes
  or stops writing.
evidence: An LTTng kernel trace only, with the exits of about twenty system calls
not_used: Logs, metrics, spans, source code
when_to_use: A database or service crashes or restarts and no metric explains it.
status: Calibrated on the 5 v3 `disk_full` runs (carts database on a full 1 GB volume). Checked on all 347 runs.
  Not run by an agent yet.
background: 'When a limit is reached the kernel says so in the return value of one system call, in one container:

  -28 no space, -99 no local port, -11 on clone the task limit, -24 too many open files. Programs get

  errors all the time when nothing is wrong, so `new_errors.py` looks for an error that is NEW: 10+

  failing calls in the suspect slice, at most 10% of that in the baseline. Only errors that mean a

  LIMIT give a verdict; other new errors are listed without one.


  Own runs: `mongod` gets -28 on 30 `fallocate` calls, 94% of its calls, 0 in the baseline - but ONLY in the slice
  that holds a crash.

  '
lookalikes: 'A peer that is down: connects fail with -111 (refused). Listed, no verdict: the fault is at the peer.

  A program that looks for a missing file (-2). Listed, no verdict.

  A limit reached as a CONSEQUENCE of another fault: the edge router runs out of descriptors when requests hang.

  '
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  new_errors.py:
    does: New error returns per container; the verdict
    usage: new_errors.py <baseline_slice> <fault_slice> <secs>
vars:
  EV: syscall_exit_(connect|write|pwrite64|writev|pwritev|fallocate|fsync|fdatasync|ftruncate|openat|socket|accept4|accept|clone|clone3|fork|vfork|mmap|bind|sendto|sendmsg)
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the 20 s suspect slice, HH:MM:SS
  base_time: start of the 20 s baseline slice, HH:MM:SS
  culprit: the container on the verdict line
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 20 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that

      starts 30 s after it, and a baseline slice that ends 20 s before it. If not, take the stretch where the rate

      changes and a stretch before it with the same traffic. Both slices are 20 s and must lie inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Find error returns that are new and mean a limit was reached.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 20 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 20 $WORK/f.txt $EV
    - new_errors.py $WORK/b.txt $WORK/f.txt 20
    read: 'A table of failing calls per container, OTHER NEW ERROR lines for new errors that are not a limit, and
      one

      VERDICT line per limit error. If several containers hit a limit, the one with the most failing calls and

      the earliest is usually the cause; check whether the others wait on it.

      '
    sets: []
    budget: 5
    outcomes:
      limit:
        when: the tool reads NEW ERROR RETURNS
        line: 'VERDICT: NEW ERROR RETURNS:'
        verdict: confirmed
        fault_type: disk_full
        next: report
      none:
        when: the tool reads NO NEW ERROR RETURNS
        line: 'VERDICT: NO NEW ERROR RETURNS'
        stop: No container hit a limit in this slice. Not this fault, or the slice missed it (see the limits).
report: 'fault_type: disk_full. The container on the verdict line, and the call and path that failed. Fix: free
  or grow the volume.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**5 of 5 in a slice that holds a crash; 0 of 5 between crashes.** A blueprint must scan the window, or read the
  logs, which name the cause at once.'
- '**No metric sees this fault** (verification target `expected_to_fail`).'
- '**0 of 20 normal runs** with the limit-only rule.'
