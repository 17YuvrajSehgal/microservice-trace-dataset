# Blueprint 47 as a structure (28-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: code_fd_leak
fault_type: code_fd_leak
title: one process opens files and does not close them
problem_class: Resource leak (file descriptors)
confirms: A process opens files faster than it closes them, so its descriptor count only grows. Nothing fails until
  the limit is reached.
evidence: An LTTng kernel trace only
not_used: Logs, metrics, spans, source code
when_to_use: A service's open descriptors climb for minutes with no change in traffic; or you look for the cause
  before a later 'too many open files'.
status: Calibrated on its 5 v3 runs; tested on all 50 runs of groups 5-7. Not yet checked on the earlier runs. Not
  run by an agent yet.
background: '`fd_growth.py` follows each descriptor opened in the slice to its close. It counts files and sockets
  apart and gives a verdict for files.


  | | this fault | the same process before |

  |---|---|---|

  | files opened in 20 s | 110-121 | |

  | of those, still open at the end | **74-85 (3.7-4.2 per second)** | 0 |


  No service slows down. The leak is far from the limit in one run.

  '
lookalikes: 'Sockets that pile up: when a service falls behind, its connections stay open longer. In `code_chatty_calls`
  the catalogue had 344 more sockets open at the end of a slice. The tool lists this as OTHER GROWTH with no verdict.

  A program that opens thousands of files and closes them (cadvisor: about 8,006 opened, 68 open at the end): the
  share bar keeps it out.

  Descriptor exhaustion (blueprint 12): calls already fail with EMFILE; that is the end state of this fault.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  fd_growth.py:
    does: Files and sockets opened and closed again, per process; the verdict (files only)
    usage: fd_growth.py <baseline_slice> <fault_slice> <secs>
vars:
  EV: syscall_exit_openat|syscall_exit_open|syscall_exit_socket|syscall_exit_accept|syscall_exit_dup|syscall_exit_epoll_create|syscall_exit_eventfd|syscall_exit_pipe|syscall_entry_close
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the suspect slice, HH:MM:SS
  base_time: start of the baseline slice, HH:MM:SS
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 20 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that
      starts 40 s after it.

      The baseline slice is the same length, just before the suspect time, with the same traffic. Both must lie
      inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Run the tool on the two slices.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 20 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 20 $WORK/f.txt $EV
    - fd_growth.py $WORK/b.txt $WORK/f.txt 20
    read: 'One table and one VERDICT line.

      '
    sets: []
    budget: 5
    outcomes:
      'yes':
        when: the tool reads FILES ARE OPENED AND NOT CLOSED
        line: 'VERDICT: FILES ARE OPENED AND NOT CLOSED'
        verdict: confirmed
        fault_type: code_fd_leak
        next: report
      'no':
        when: the tool reads NO FILE DESCRIPTOR GROWTH
        line: 'VERDICT: NO FILE DESCRIPTOR GROWTH'
        stop: No process keeps the files it opens. Not this fault (a socket leak is not judged by this tool).
report: 'fault_type: code_fd_leak. Copy the VERDICT line. Fix: close every file you open; do not keep handles in
  a list that only grows.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5**; reversed quiet.'
- '**Quiet on the other 45 runs.**'
- '**The rule was changed after run 1, in four ways**; see RESULTS. Runs 2-5 were tested with the final rule.'
- '**A socket leak is not confirmed by this tool.** Socket growth is listed without a verdict.'
- '**Not yet run on the earlier runs.**'
