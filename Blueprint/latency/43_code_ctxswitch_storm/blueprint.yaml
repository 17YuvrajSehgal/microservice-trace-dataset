# Blueprint 43 as a structure (28-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: code_ctxswitch_storm
fault_type: code_ctxswitch_storm
title: one process has hundreds of threads that wake up all the time
problem_class: CPU (scheduler load)
confirms: One process runs a large pool of threads that each wake up, do almost nothing and sleep again, so the
  scheduler is busy with them.
evidence: An LTTng kernel trace only
not_used: Logs, metrics, spans, source code
when_to_use: A service is slower and uses more CPU with no more requests; or the host's context-switch rate jumped.
status: Calibrated on its 5 v3 runs; tested on all 50 runs of groups 5-7. Not yet checked on the earlier runs. Not
  run by an agent yet.
background: 'Each wake-up and each sleep of a thread is a context switch. `switch_rate.py` counts, per process,
  how often its threads left the

  CPU, how many threads did so, and how long each stayed on the CPU.


  | | this fault | the same process before |

  |---|---|---|

  | context switches per second | **85,970-92,483** | 4,550-4,707 |

  | threads that ran | 415-420 | |

  | time on the CPU each time (median) | 13-14 microseconds | |

  | CPU used | 1.35-1.47 cores | |

  '
lookalikes: 'A thread leak (blueprint 35): many threads, all asleep, almost no switches.

  A spin loop (blueprint 36): one thread that never sleeps, long runs.

  A busy proxy: toxiproxy made up to 16,407 switches per second over 17 threads; the thread bar keeps it out.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  switch_rate.py:
    does: Context switches, threads and run length per process; the verdict
    usage: switch_rate.py <baseline_slice> <fault_slice> <secs>
vars:
  EV: sched_switch
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the suspect slice, HH:MM:SS
  base_time: start of the baseline slice, HH:MM:SS
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 10 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that
      starts 40 s after it.

      The baseline slice is the same length, just before the suspect time, with the same traffic. Both must lie
      inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Run the tool on the two slices.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 10 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 10 $WORK/f.txt $EV
    - switch_rate.py $WORK/b.txt $WORK/f.txt 10
    read: 'One table and one VERDICT line.

      '
    sets: []
    budget: 5
    outcomes:
      'yes':
        when: the tool reads MANY THREADS WAKE UP ALL THE TIME
        line: 'VERDICT: MANY THREADS WAKE UP ALL THE TIME'
        verdict: confirmed
        fault_type: code_ctxswitch_storm
        next: report
      'no':
        when: the tool reads NO THREAD STORM
        line: 'VERDICT: NO THREAD STORM'
        stop: No process has a storm of short thread wake-ups. Not this fault.
report: 'fault_type: code_ctxswitch_storm. Copy the VERDICT line. Fix: size the thread pool to the number of cores;
  wait on an event, do not poll with a short sleep.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5**; reversed quiet.'
- '**Quiet on the other 45 runs.**'
- '**The service was slowed more in the traced runs than in the calibration without tracing** (catalogue p95 about
  87 ms against 32 ms). A likely reason is the tracing cost per context switch; this was not checked.'
- '**Not yet run on the earlier runs.**'
