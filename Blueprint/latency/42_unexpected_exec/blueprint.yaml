# Blueprint 42 as a structure (27-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: unexpected_exec
fault_type: unexpected_exec
title: programs never seen in a container start there (a shell in a service)
problem_class: Security (code execution)
confirms: Someone runs a shell and tools inside a service container, so programs that container never runs start
  there.
evidence: An LTTng kernel trace only, with `sched_process_exec`
not_used: Logs, metrics, spans, source code
when_to_use: A service may be compromised; nothing is slow or failing.
status: Calibrated on its 5 v3 runs; tested on all 20 group-4 runs. Not yet checked on the earlier runs. Not run
  by an agent yet.
background: 'Every container runs the same few programs. `new_programs.py` lists, per container (pid namespace),
  the programs

  started in the suspect slice that never started there in the baseline slice. The host''s namespace is left out:

  monitoring scripts start about 1,280 programs a minute there.


  | | this fault (front-end) | other containers |

  |---|---|---|

  | new programs in 60 s | **8**: cat, env, id, ls, ps, sh, uname, wc (24 starts) | 0 |

  '
lookalikes: 'A deployment or restart: the service''s own program starts again (not new in a 60 s baseline only if
  it ran before).

  Health checks that run a command in the container: the same program every time, in the baseline too.

  The host''s own scripts: a different namespace, left out.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  new_programs.py:
    does: Programs started per container that never started there before; the verdict
    usage: new_programs.py <baseline_slice> <fault_slice>
vars:
  EV: sched_process_exec
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the suspect slice, HH:MM:SS
  base_time: start of the baseline slice, HH:MM:SS
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 60 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a 60 s slice
      that starts at it (programs start rarely).

      The baseline slice is the same length, just before the suspect time, with the same traffic. Both must lie
      inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: List programs started per container that are new.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 60 $WORK/xb.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 60 $WORK/xf.txt $EV
    - new_programs.py $WORK/xb.txt $WORK/xf.txt
    read: 'One row per container and one VERDICT line listing the new programs.

      '
    sets: []
    budget: 5
    outcomes:
      new:
        when: the tool reads NEW PROGRAMS IN A CONTAINER
        line: 'VERDICT: NEW PROGRAMS IN A CONTAINER'
        verdict: confirmed
        fault_type: unexpected_exec
        next: report
      none:
        when: the tool reads NO NEW PROGRAMS
        line: 'VERDICT: NO NEW PROGRAMS'
        stop: No new program in any container. Not this fault.
report: 'fault_type: unexpected_exec. The container and programs on the verdict line. Treat the container as compromised:
  keep it for analysis, redeploy from a clean image.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5** (the same 8 programs); reversed quiet.'
- '**Quiet on the other 15 group-4 runs.**'
- '**Injected through `docker exec`**: the shell''s parent is the container runtime, not the service. The tool does
  not use the parent.'
- '**A 60 s baseline is short**: a program that runs once every few minutes in normal operation would look new.'
- '**Not yet run on the earlier runs.**'
