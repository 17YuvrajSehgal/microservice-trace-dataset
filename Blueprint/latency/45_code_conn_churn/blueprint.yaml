# Blueprint 45 as a structure (28-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: code_conn_churn
fault_type: code_conn_churn
title: a client opens a new connection for every call
problem_class: Network (connection handling)
confirms: 'A client has keep-alive switched off: every call to a service opens a connection and closes it after
  one answer.'
evidence: An LTTng kernel trace only
not_used: Logs, metrics, spans, source code
when_to_use: One caller got a little slower with the same number of calls, and the callee accepts far more connections
  than before.
status: Calibrated on its 5 v3 runs; tested on all 50 runs of groups 5-7. Not yet checked on the earlier runs. Not
  run by an agent yet.
background: '`conn_rate.py` counts, per client and server port, the connections opened, the data segments each one
  carried, and how they ended.


  | | this fault | the same pair before |

  |---|---|---|

  | connections opened per second | **151-169** | 0.1-0.3 |

  | data segments from the client per connection | 1 | |

  | closed normally / reset | 100% / 0% | |

  '
lookalikes: 'A service that opens a database connection for most requests: here the healthy catalogue opens 50-95
  per second to its database, but each carries 5 or 6 calls, so the calls bar keeps it out. It rose to 384 per second
  when the catalogue got four times the calls.

  A reset storm (blueprint 22): the connections end with a reset, not a normal close.

  A port scan (blueprint 34): many different ports, almost all refused.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  conn_rate.py:
    does: Connections opened, calls per connection and how they ended, per client and server port; the verdict
    usage: conn_rate.py <fault_slice> <secs> [baseline_slice]
vars:
  EV: net_dev_queue
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the suspect slice, HH:MM:SS
  base_time: start of the baseline slice, HH:MM:SS
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 20 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that
      starts 40 s after it.

      The baseline slice is the same length, just before the suspect time, with the same traffic. Both must lie
      inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Run the tool on the two slices.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 20 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 20 $WORK/f.txt $EV
    - conn_rate.py $WORK/f.txt 20 $WORK/b.txt
    read: 'One table and one VERDICT line.

      '
    sets: []
    budget: 5
    outcomes:
      'yes':
        when: the tool reads A NEW CONNECTION FOR EVERY CALL
        line: 'VERDICT: A NEW CONNECTION FOR EVERY CALL'
        verdict: confirmed
        fault_type: code_conn_churn
        next: report
      'no':
        when: the tool reads NO CONNECTION CHURN
        line: 'VERDICT: NO CONNECTION CHURN'
        stop: No client opens one connection per call. Not this fault.
report: 'fault_type: code_conn_churn. Copy the VERDICT line. Fix: keep connections alive and reuse them; do not
  send `Connection: close`.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5**; reversed quiet.'
- '**Quiet on the other 45 runs.**'
- '**Not yet run on the earlier runs.**'
