# Blueprint 31 as a structure (25-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: slow_client
fault_type: slow_client
title: slow clients hold a service's worker threads (thread pool exhaustion)
problem_class: Concurrency (a pool)
confirms: Many connections send a request body very slowly; each holds one worker thread, so the service has no
  thread left for normal requests.
evidence: An LTTng kernel trace only, with `net_dev_queue`
not_used: Logs, metrics, spans, source code
when_to_use: A service stops answering while its process is alive, logs nothing and its dependencies are fine.
status: Calibrated on the 5 v3 `slow_client` runs (carts, 220 slow connections, 200 worker threads). Checked on
  all 347 runs. Not run by an agent yet.
background: '`unanswered.py` counts, per server address and port, connections on which the client sent data and
  the

  server sent nothing for 5 s or more. A service that stopped answering has many. When most of them keep

  sending segments of 16 bytes or less at a slow, steady pace, the clients are what holds the threads.


  `inside_wait.py` cannot see this fault: a request that never gets an answer has no end (0 of 5).

  '
lookalikes: 'A service whose dependency is frozen: it does not answer either, but no client trickles (`dependency_outage`).

  A blocked event loop: it does not answer, and it uses one whole core (`code_event_loop_block`).

  A service waiting for a full upstream: the edge router and the load generator also show as callers.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  unanswered.py:
    does: Connections with a request and no answer, per server; the verdict
    usage: unanswered.py <fault_slice> <secs> <baseline_slice>
vars:
  EV: net_dev_queue|sched_switch|sched_waking|sched_wakeup
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the 20 s suspect slice, HH:MM:SS
  base_time: start of the 20 s baseline slice, HH:MM:SS
  culprit: the container on the verdict line
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 20 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that

      starts 30 s after it, and a baseline slice that ends 20 s before it. If not, take the stretch where the rate

      changes and a stretch before it with the same traffic. Both slices are 20 s and must lie inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Find a service with many unanswered connections, and whether the clients trickle.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 20 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 20 $WORK/f.txt $EV
    - unanswered.py $WORK/f.txt 20 $WORK/b.txt
    read: 'A table per server, ALSO NOT ANSWERING lines for callers that wait on others, and VERDICT lines. Only
      a verdict

      that contains SLOW CLIENTS is this fault; without it the service stopped answering for another reason.

      '
    sets: []
    budget: 5
    outcomes:
      slow:
        when: the tool reads SERVICE DOES NOT ANSWER with a SLOW CLIENTS clause
        line: 'SLOW CLIENTS:'
        verdict: confirmed
        fault_type: slow_client
        next: report
      silent_other:
        when: the tool reads SERVICE DOES NOT ANSWER without a SLOW CLIENTS clause
        line: 'VERDICT: SERVICE DOES NOT ANSWER:'
        stop: The service stopped answering, but not because of slow clients. Find what it waits for.
      answers:
        when: the tool reads NO SERVICE THAT DOES NOT ANSWER
        line: 'VERDICT: NO SERVICE THAT DOES NOT ANSWER'
        stop: Every service answers. Not this fault.
report: 'fault_type: slow_client. The service on the verdict line, and the client address that trickles. Fix: a
  read

  timeout for request bodies on that service, or a limit per client address.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5**, one verdict each; reversed quiet.'
- '**The SLOW CLIENTS clause: 0 of 342 other runs.** The plain ''does not answer'' verdict: 17 other runs, all real
  outages.'
- '**One change after the first pass**: callers that wait on the silent service are reported separately.'
- '**A second fix after the sweep check**: a connection is answered if ANY interface shows server data.'
