# Blueprint 49 as a structure (28-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: code_blocking_wait
fault_type: code_blocking_wait
title: a busy thread keeps stopping for one fixed time
problem_class: Code defect (blocking call)
confirms: The one thread that does a service's work makes a blocking call of a fixed length, so everything queued
  behind it waits.
evidence: An LTTng kernel trace only
not_used: Logs, metrics, spans, source code
when_to_use: A single-threaded service (Node) is slower at the median and the tail while its CPU use did not rise.
status: Calibrated on its 5 v3 runs; tested on all 50 runs of groups 5-7. Not yet checked on the earlier runs. Not
  run by an agent yet.
background: 'An event-loop thread is on the CPU most of the time and sleeps for well under a millisecond. `busy_sleep.py`
  looks at threads

  that are on the CPU at least half the slice and counts their sleeps of 15 ms or more.


  | | this fault | the same thread before |

  |---|---|---|

  | sleeps of 15 ms or more in 10 s | **26-39, all about 30 ms** | 0 |

  | time lost in them | 0.78-1.17 s | |

  | on the CPU | 83-86% of the slice | |

  '
lookalikes: 'A blocked event loop (blueprint 17) or regex backtracking (blueprint 38): the thread is ON the CPU
  for the whole stall.

  A thread that waits for its next piece of work: a database connection thread was on the CPU 52-56% of two healthy
  slices and slept 44-51 times for 18 to 182 ms. Sleeps of mixed length are listed without a verdict.

  A CPU limit (blueprint 1): the thread is runnable and waits, it does not sleep.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  busy_sleep.py:
    does: Long sleeps of threads that are mostly on the CPU; the verdict
    usage: busy_sleep.py <baseline_slice> <fault_slice> <secs>
vars:
  EV: sched_switch
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the suspect slice, HH:MM:SS
  base_time: start of the baseline slice, HH:MM:SS
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 10 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that
      starts 40 s after it.

      The baseline slice is the same length, just before the suspect time, with the same traffic. Both must lie
      inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Run the tool on the two slices.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 10 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 10 $WORK/f.txt $EV
    - busy_sleep.py $WORK/b.txt $WORK/f.txt 10
    read: 'One table and one VERDICT line.

      '
    sets: []
    budget: 5
    outcomes:
      'yes':
        when: the tool reads A BUSY THREAD KEEPS STOPPING
        line: 'VERDICT: A BUSY THREAD KEEPS STOPPING'
        verdict: confirmed
        fault_type: code_blocking_wait
        next: report
      'no':
        when: the tool reads NO BUSY THREAD STOPS
        line: 'VERDICT: NO BUSY THREAD STOPS'
        stop: No busy thread has long sleeps of one fixed length. Not this fault (a blocking call of varying length
          is not judged).
report: 'fault_type: code_blocking_wait. Copy the VERDICT line. Fix: never block the event loop; use the asynchronous
  form of the call.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5**; reversed quiet.'
- '**Quiet on the other 45 runs.**'
- '**The bars were set on run 1, and the rule was narrowed after the 50-run test**; see RESULTS.'
- '**A blocking call whose length varies is not confirmed by this tool.**'
- '**Not yet run on the earlier runs.**'
