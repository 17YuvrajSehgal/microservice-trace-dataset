# Blueprint 34 as a structure (25-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: port_scan
fault_type: port_scan
title: one address tries very many ports (a port scan from inside the stack)
problem_class: Security (reconnaissance)
confirms: 'One container''s address tries to connect to hundreds of different ports on many hosts, almost all refused:
  a scan from a compromised service.'
evidence: An LTTng kernel trace only, with `net_dev_queue`
not_used: Logs, metrics, spans, source code
when_to_use: Nothing is slow and nothing fails, but someone asks whether a service is probing its neighbours.
status: Calibrated on the 5 v3 `port_scan` runs. Tested on those and on 15 other v3 slices; not yet on the 347 sweep
  runs. Not run by an agent yet.
background: 'A service talks to a few peers on a few ports, again and again. A scan is the opposite: one source,

  hundreds of different destination ports, each tried once, almost all refused. `scan_fanout.py` counts,

  per source address, the different (address, port) pairs it tried (SYN packets) and how many were reset.


  No metric, log or span shows it (measured): it uses no CPU and moves no data.

  '
lookalikes: 'A busy client opening many connections: many attempts, but to the same one or two ports.

  A service whose peer is down: refused connects, but to one port.

  Health checks: many hosts, one port each.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  scan_fanout.py:
    does: Different targets tried per source address; the verdict
    usage: scan_fanout.py <fault_slice> <secs> <baseline_slice>
vars:
  EV: net_dev_queue|sched_switch|sched_waking|sched_wakeup
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the 20 s suspect slice, HH:MM:SS
  base_time: start of the 20 s baseline slice, HH:MM:SS
  culprit: the container on the verdict line
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 20 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that

      starts 30 s after it, and a baseline slice that ends 20 s before it. If not, take the stretch where the rate

      changes and a stretch before it with the same traffic. Both slices are 20 s and must lie inside the trace.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Count the different targets each source address tries.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 20 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 20 $WORK/f.txt $EV
    - scan_fanout.py $WORK/f.txt 20 $WORK/b.txt
    read: 'One row per source and one VERDICT line. The scanner here runs in the front-end''s network namespace
      from the

      host, so the address is the front-end''s while the program name is the scanner''s: go by the address.

      '
    sets: []
    budget: 5
    outcomes:
      scan:
        when: the tool reads ONE SOURCE TRIES MANY PORTS
        line: 'VERDICT: ONE SOURCE TRIES MANY PORTS'
        verdict: confirmed
        fault_type: port_scan
        next: report
      none:
        when: the tool reads NO SOURCE TRIES MANY PORTS
        line: 'VERDICT: NO SOURCE TRIES MANY PORTS'
        stop: No address fans out over many ports. Not this fault.
report: 'fault_type: port_scan. The address on the verdict line and the program that sent the packets. Treat that

  service as compromised.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5**, 3,904-3,910 pairs on 262 ports; reversed quiet; quiet on 15 other v3 slices.'
- '**Not yet run on the 347 sweep runs** (needs a SLURM job).'
- '**`new_errors.py` gives no verdict for it** (refused connects are not a limit).'
