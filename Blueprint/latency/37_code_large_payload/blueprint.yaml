# Blueprint 37 as a structure (26-11-2026). The source of BLUEPRINT.md (bp_render.py) and of the agent's steps.

id: code_large_payload
fault_type: code_large_payload
title: one service's answers became much larger with the same number of calls
problem_class: Data volume (a code defect)
confirms: A service returns far more data per answer than its callers need, so bytes on the network grow while calls
  stay the same.
evidence: An LTTng kernel trace only, with `net_dev_queue`
not_used: Logs, metrics, spans, source code
when_to_use: Network traffic or a caller's memory grows with no change in request rate.
status: Calibrated on its 5 v3 runs; tested on all 20 group-2 runs. One rule added after run 1. Not yet checked
  on the earlier 349 runs. Not run by an agent yet.
background: '`bytes_per_call.py` counts, per server address and port, the answers per second and the bytes per answer,

  each packet once. A larger answer travels through every service in front of the source, so those rise

  too, but less; the verdict names the largest rise.


  | | the source (catalogue) | the front-end, edge router, port forward |

  |---|---|---|

  | bytes per answer | **0.4-0.5 -> 7.5-9.0 kB (17-21 times)** | about 1.5 -> 6.2 kB (about 4 times) |

  | answers per second | 238-251 before, 242-247 now | unchanged |

  '
lookalikes: 'Data exfiltration: many bytes to an address that is not a normal caller.

  More traffic: more calls, the same bytes per answer.

  The services in front of the source: smaller rise, listed as ''also larger''.'
tools:
  idx_summary.py:
    does: Date, span, health
    usage: idx_summary.py <trace_dir> [--rate SECONDS]
  extract_slice.sh:
    does: Cuts one slice with the events you name
    usage: extract_slice.sh <trace_dir> <date> <time> <secs> <out> '<regex>'
  bytes_per_call.py:
    does: Answers per second and bytes per answer, per server; the verdict
    usage: bytes_per_call.py <fault_slice> <secs> <baseline_slice>
vars:
  EV: net_dev_queue
facts:
  day: trace date, YYYY-MM-DD (UTC)
  trace_start: first packet time, HH:MM:SS
  trace_end: last packet time, HH:MM:SS
  fault_time: start of the 10 s suspect slice, HH:MM:SS
  base_time: start of the 10 s baseline slice, HH:MM:SS
start: check_trace
steps:
  check_trace:
    kind: fixed
    goal: Know the date, when the trace starts and ends, and whether it is healthy.
    run:
    - - idx_summary.py
      - $TRACE
    extract:
      day: ^date \(UTC\)\s*:\s*(\S+)
      trace_start: ^trace start\s*:\s*(\d\d:\d\d:\d\d)
      trace_end: ^trace end\s*:\s*(\d\d:\d\d:\d\d)
      duration_s: ^duration\s*:\s*([\d.]+)
      lost_events: ^lost events\s*:\s*(.+)$
    next: orient
  orient:
    kind: guided
    goal: Pick a suspect time and a baseline time, 10 s each.
    suggested:
    - idx_summary.py $TRACE --rate 10
    read: 'The last table is the trace data written per 10 s. If you were given a suspect time, take a slice that

      starts 40 s after it, and a baseline slice that starts 30 s before it. If not, take the stretch where the

      rate changes and a stretch before it with the same traffic. Both slices are 10 s.

      '
    sets:
    - fault_time
    - base_time
    budget: 3
    outcomes:
      times_chosen:
        when: both times are chosen
        next: measure
  measure:
    kind: guided
    goal: Compare bytes per answer and answers per second, per server.
    suggested:
    - extract_slice.sh $TRACE <day> <base_time> 10 $WORK/b.txt $EV
    - extract_slice.sh $TRACE <day> <fault_time> 10 $WORK/f.txt $EV
    - bytes_per_call.py $WORK/f.txt 10 $WORK/b.txt
    read: 'One row per server, one VERDICT line for the largest rise, and ALSO LARGER lines.

      '
    sets: []
    budget: 5
    outcomes:
      larger:
        when: the tool reads ANSWERS GOT LARGER
        line: 'VERDICT: ANSWERS GOT LARGER'
        verdict: confirmed
        fault_type: code_large_payload
        next: report
      none:
        when: the tool reads NO LARGER ANSWERS
        line: 'VERDICT: NO LARGER ANSWERS'
        stop: No server's answers grew. Not this fault.
report: 'fault_type: code_large_payload. The server on the verdict line. Fix: return only the fields the caller
  needs, and

  page large results. The trace cannot see which fields.

  '
measured:
- 'Per-run lines: `RESULTS.md` next to this file.'
- '**Own runs: 5 of 5** (17-21 times larger answers); reversed quiet.'
- '**Quiet on the other 15 group-2 runs.**'
- '**One rule added after run 1**: only the largest rise gets a verdict; the 3 services in front of the source rose
  about 4 times and are listed apart.'
- '**Not yet run on the earlier 349 runs.**'
