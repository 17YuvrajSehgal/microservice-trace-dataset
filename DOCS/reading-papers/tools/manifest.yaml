# Reference manifest for blueprints/REFERENCE-PACK-FOR-KERNEL-TRACE.md
#
# One entry per SOURCE, keyed by slug. `blueprints` lists every numbered directory the source
# belongs in - a source used by three blueprints is downloaded once and copied into all three,
# because the numbered directories are for reading, not for storage.
#
# kind:  pdf   -> fetch `url` as paper.pdf
#        html  -> fetch `url` as page.html AND render page.md with trafilatura
#        both  -> a landing page (md) plus a pdf
#        local -> already downloaded by hand; `from` names an existing file to adopt
#
# status mirrors the reference pack's tags: V seen, S snippet only, M from memory.
# `note` records why something cannot be fetched, so a [x] in the pack has a reason here.

