note: Names the failure mode - Event Handler Poisoning. A single long-running callback
  poisons the event loop, so a single-threaded runtime stalls ENTIRELY, including
  requests that never touch the slow path. That is exactly the shape our recipe injects.
  The earlier EUROSEC 2017 paper by the same authors (10.1145/3065913.3065916) is
  the original statement of EHP but is paywalled.
